<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Key Escape — a room escape game for kids</title>
<meta name="description" content="A friendly ten-room escape game for kids. Find the clues, solve the puzzles, collect all ten star keys.">
<style>
  *,*::before,*::after{box-sizing:border-box}
  [hidden]{display:none !important}
  :root{
    --bg:#1a1033; --bg2:#2a1b52; --panel:#fffdf7; --ink:#2b2340;
    --gold:#ffc93c; --pink:#ff7eb6; --mint:#3ddc97; --sky:#5ec8ff;
    --shadow:0 8px 0 rgba(0,0,0,.18);
  }
  html,body{height:100%}
  body{
    margin:0; font-family:"Baloo 2",Verdana,"Trebuchet MS",system-ui,sans-serif;
    background:radial-gradient(120% 90% at 50% 0%,var(--bg2),var(--bg));
    color:var(--ink); min-height:100%; padding:12px;
    display:flex; flex-direction:column; align-items:center; gap:12px;
  }
  h1,h2,h3{margin:0}
  button{font:inherit; cursor:pointer; border:none; background:none; color:inherit}

  .wrap{width:100%; max-width:900px; display:flex; flex-direction:column; gap:12px}

  header.hud{
    display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    background:var(--panel); border-radius:18px; padding:10px 14px; box-shadow:var(--shadow);
  }
  .title{font-size:20px; font-weight:800; letter-spacing:.5px}
  .title .star{color:#e8a300}
  .roomname{font-size:15px; background:#efe9ff; border-radius:999px; padding:4px 12px; font-weight:700}
  .prog{margin-left:auto; display:flex; align-items:center; gap:8px; min-width:150px}
  .bar{flex:1; height:14px; background:#efe9ff; border-radius:999px; overflow:hidden; min-width:70px}
  .bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--gold),#ff9f5a);
    border-radius:999px; transition:width .5s}
  .count{font-weight:800; font-size:15px; white-space:nowrap}

  .stage{position:relative; width:100%; aspect-ratio:4/3; max-height:62vh;
    border-radius:22px; overflow:hidden; box-shadow:var(--shadow); background:#000}
  .stage svg{position:absolute; inset:0; width:100%; height:100%; display:block}
  .hot{cursor:pointer}
  .hot:hover{filter:brightness(1.12) drop-shadow(0 0 8px rgba(255,255,255,.85))}
  .hot:focus-visible{outline:3px solid #fff; outline-offset:2px}

  .say{background:var(--panel); border-radius:18px; padding:12px 16px; box-shadow:var(--shadow);
    font-size:17px; font-weight:700; min-height:56px; display:flex; align-items:center; gap:10px}
  .say .face{font-size:24px}

  .bag{display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    background:rgba(255,255,255,.12); border-radius:18px; padding:8px 12px; color:#fff}
  .bag .label{font-weight:800; font-size:14px; letter-spacing:1px; opacity:.85}
  .item{font-size:24px; background:var(--panel); border-radius:12px; padding:4px 8px; box-shadow:0 3px 0 rgba(0,0,0,.25)}

  .scrim{position:fixed; inset:0; background:rgba(12,6,30,.72); display:flex;
    align-items:center; justify-content:center; padding:16px; z-index:20; overflow:auto}
  .card{background:var(--panel); border-radius:24px; padding:20px; width:min(470px,100%);
    box-shadow:0 12px 0 rgba(0,0,0,.3); text-align:center; margin:auto}
  .card h2{font-size:22px; margin-bottom:6px}
  .card p{font-size:16px; margin:8px 0 14px}
  .btn{background:var(--mint); color:#0d3a29; font-weight:800; border-radius:999px;
    padding:10px 22px; box-shadow:0 4px 0 #23a874; font-size:17px}
  .btn:active{transform:translateY(3px); box-shadow:0 1px 0 #23a874}
  .btn.alt{background:var(--sky); box-shadow:0 4px 0 #2a92c9; color:#06364f}
  .btn.ghost{background:#efe9ff; box-shadow:0 4px 0 #cdc2f0; color:#3a2f5e}

  .pad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:10px auto; max-width:260px}
  .pad button{background:#efe9ff; border-radius:14px; padding:12px 0; font-size:22px; font-weight:800;
    box-shadow:0 4px 0 #cdc2f0}
  .pad button:active{transform:translateY(3px); box-shadow:0 1px 0 #cdc2f0}
  .screen{font-size:34px; letter-spacing:10px; font-weight:800; background:#2b2340; color:var(--gold);
    border-radius:14px; padding:8px; min-height:52px}
  .row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:10px 0}
  .big{font-size:40px; background:#efe9ff; border-radius:18px; padding:10px 14px; box-shadow:0 5px 0 #cdc2f0;
    line-height:1.1; min-width:70px}
  .big:active{transform:translateY(3px); box-shadow:0 2px 0 #cdc2f0}
  .big.picked{outline:4px solid var(--pink)}
  .big.lit{outline:5px solid var(--gold); transform:scale(1.12); filter:brightness(1.3)}
  .clue{font-size:34px; letter-spacing:6px}
  .msg{font-size:19px; min-height:30px; font-weight:700}
  .shake{animation:sh .4s}
  @keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .pop{animation:pp .5s}
  @keyframes pp{50%{transform:scale(1.18)}}

  .map{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:12px 0}
  .map b{background:#efe9ff; border-radius:12px; padding:8px 0; font-size:19px; font-weight:800}
  .map b.done{background:var(--gold)}
  .map b.now{outline:3px solid var(--pink)}

  .conf{position:fixed; inset:0; pointer-events:none; z-index:30; overflow:hidden}
  .conf i{position:absolute; top:-24px; font-size:22px; animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

  /* advanced-room puzzle bits */
  .grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; max-width:250px; margin:10px auto}
  .grid4 div{aspect-ratio:1; background:#efe9ff; border-radius:10px; display:flex; align-items:center;
    justify-content:center; font-size:26px}
  .grid4 div.wall{background:#6b5a48}
  .grid4 button{aspect-ratio:1; background:#fff; border-radius:10px; border:3px dashed #cdc2f0; font-size:26px}
  .grid4 div.on,.grid4 button.on{background:#3ddc97; border-style:solid}
  .queue{font-size:22px; letter-spacing:3px; background:#efe9ff; border-radius:12px; padding:8px; min-height:42px}
  .dpad{display:grid; grid-template-columns:repeat(3,58px); grid-template-rows:repeat(2,58px);
    gap:6px; justify-content:center; margin:10px auto}
  .dpad button{background:#efe9ff; border-radius:14px; font-size:26px; box-shadow:0 4px 0 #cdc2f0}
  .dpad button:active{transform:translateY(3px); box-shadow:0 1px 0 #cdc2f0}
  .lamps{display:flex; gap:8px; justify-content:center; margin:12px 0}
  .lamps button{font-size:38px; border-radius:14px; padding:6px 10px; background:#2b2340; box-shadow:0 4px 0 #14102a}
  .lamps button.on{background:#ffd93d; box-shadow:0 4px 0 #c9a520}
  .mini{font-size:15px; opacity:.8; margin-top:4px}

  @media (max-width:520px){
    .title{font-size:17px} .say{font-size:15px} .stage{max-height:48vh} .big{font-size:32px; min-width:60px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hud">
    <div class="title"><span class="star">★</span> Star Key Escape</div>
    <div class="roomname" id="roomname">Toy Room</div>
    <div class="prog" aria-label="star keys collected">
      <span class="count" id="count">⭐ 0/10</span>
      <span class="bar"><i id="fill"></i></span>
    </div>
  </header>

  <div class="stage" id="stage"></div>

  <div class="say"><span class="face">🦊</span><span id="say">Tap things in the room to look at them!</span></div>

  <div class="bag"><span class="label">BAG</span><span id="bag"></span></div>
</div>

<div class="conf" id="conf" hidden></div>
<div class="scrim" id="scrim" hidden><div class="card" id="card"></div></div>

<script>
(function(){
  "use strict";
  const $ = id => document.getElementById(id);
  const stage=$("stage"), scrim=$("scrim"), card=$("card");
  const SAVE="starKeyEscape.furthest";

  /* ---------- state (memory is the source of truth; storage is write-through) ---------- */
  const S = {
    room:0, keys:0, bag:[], furthest:0,
    solved:{},          // room index -> true
    want:[], got:[],    // "tap in order" puzzles
    code:null,          // keypad answer
    picked:[],          // multi-pick puzzles
    onDone:null,
    seq:[], busy:false
  };

  function loadSave(){
    try{
      const v = localStorage.getItem(SAVE);
      if(v!==null){ const n=parseInt(v,10); if(!isNaN(n)) S.furthest=Math.min(Math.max(n,0),ROOMS.length-1); }
    }catch(e){/* storage unavailable: play without resume */}
  }
  function save(){
    try{ localStorage.setItem(SAVE,String(S.furthest)); }catch(e){}
  }

  /* ---------- small helpers ---------- */
  function say(t){ $("say").textContent = t; }
  function give(item){ if(item && !S.bag.includes(item)) S.bag.push(item); drawBag(); }
  function drawBag(){
    $("bag").innerHTML = S.bag.length
      ? S.bag.map(e=>'<span class="item">'+e+'</span>').join("")
      : '<span style="opacity:.7;font-size:14px">empty</span>';
  }
  function drawProgress(){
    $("count").textContent = "⭐ "+S.keys+"/"+ROOMS.length;
    $("fill").style.width = (S.keys/ROOMS.length*100)+"%";
  }
  function close(){ scrim.hidden = true; card.innerHTML=""; }
  function open(html){ card.innerHTML = html; scrim.hidden = false; }
  function wrong(){ card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake"); }
  function msg(t){ const m=card.querySelector(".msg"); if(m) m.textContent=t; }
  function confetti(){
    const c=$("conf"); c.hidden=false; c.innerHTML="";
    const bits=["🎉","⭐","🎈","✨","🌟","🎊"];
    for(let i=0;i<40;i++){
      const s=document.createElement("i");
      s.textContent=bits[i%bits.length];
      s.style.left=Math.random()*100+"%";
      s.style.animationDuration=(2+Math.random()*2.5)+"s";
      s.style.animationDelay=(Math.random()*1.2)+"s";
      c.appendChild(s);
    }
    setTimeout(()=>{c.hidden=true; c.innerHTML="";},6000);
  }

  /* ---------- generic puzzle plumbing ---------- */
  function order(want, done){ S.want=want; S.got=[]; S.onDone=done; }
  function ordTap(b){
    const v=b.dataset.ord, i=S.got.length;
    if(v!==S.want[i]){
      S.got=[]; wrong(); msg("Oops — start from the beginning!");
      card.querySelectorAll("[data-ord]").forEach(x=>x.classList.remove("picked"));
      return;
    }
    S.got.push(v); b.classList.add("picked","pop");
    msg(S.got.length===S.want.length ? "Yes!" : (S.showGot ? S.got.join("") : "Keep going…"));
    if(S.got.length===S.want.length) setTimeout(S.onDone,350);
  }
  function pickTap(b){
    if(b.dataset.pick==="ok"){ b.classList.add("picked"); setTimeout(S.onDone,300); }
    else { wrong(); msg("Not that one — look again!"); }
  }
  function numTap(b){
    const scr=$("scr"), n=b.dataset.num;
    if(S.codeLen>1){                                  // vault: collect digits, then check
      S.entry=(S.entry||"")+n;
      scr.textContent=S.entry;
      if(S.entry.length<S.codeLen) return;
      if(+S.entry===S.code) return void setTimeout(S.onDone,300);
      wrong(); scr.textContent="✖"; S.entry="";
      setTimeout(()=>{ const e=$("scr"); if(e) e.textContent="_"; },800);
      return;
    }
    scr.textContent=n;
    if(+n===S.code){ setTimeout(S.onDone,300); }
    else { wrong(); scr.textContent="✖"; setTimeout(()=>{ const e=$("scr"); if(e) e.textContent="_"; },700); }
  }
  function keypad(zero){
    const keys=[1,2,3,4,5,6,7,8,9].concat(zero?[0]:[]);
    return '<div class="pad">'+keys.map(n=>'<button data-num="'+n+'">'+n+'</button>').join("")+
           (zero?'<button data-wipe>⌫</button>':'')+'</div>';
  }

  /* solved! give the souvenir, celebrate, point at the door */
  function solve(item, title, body){
    S.solved[S.room]=true; give(item); confetti();
    open('<h2>'+title+'</h2><div style="font-size:56px">'+item+'</div><p>'+body+'</p>'+
         '<div class="row"><button class="btn" data-close>Open the door!</button></div>');
    say("The door is unlocked now — tap it!");
    render();
  }

  /* ---------- shared SVG pieces ---------- */
  function door(o){
    const g=o.frame||"#8a5a2b", p=o.panel||"#a06b35", x=o.x||610, y=o.y||170,
          w=o.w||150, h=o.h||270, isOpen=S.solved[S.room];
    return `<g class="hot" data-go="door" tabindex="0" role="button" aria-label="door">
      <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="${g}"/>
      <rect x="${x+16}" y="${y+16}" width="${w-32}" height="${h-32}" rx="9" fill="${isOpen?'#1b1030':p}"/>
      ${isOpen ? `<text x="${x+w/2}" y="${y+h/2+14}" font-size="44" text-anchor="middle">✨</text>`
             : `<rect x="${x+w/2-35}" y="${y+60}" width="70" height="48" rx="8" fill="#241a10"/>
                <text x="${x+w/2}" y="${y+94}" font-size="30" text-anchor="middle" fill="#ffd85e">⭐</text>`}
      <circle cx="${x+18}" cy="${y+h/2+20}" r="9" fill="#ffd85e"/>
    </g>`;
  }
  function sign(o){
    return `<g class="hot" data-go="${o.go}" tabindex="0" role="button" aria-label="clue">
      <rect x="${o.x}" y="${o.y}" width="${o.w||220}" height="${o.h||130}" rx="10"
            fill="#fffbee" stroke="${o.edge||"#d0b98a"}" stroke-width="6"/>
      ${o.inner||""}</g>`;
  }
  function svg(inner){ return '<svg viewBox="0 0 800 600" role="img" aria-label="room">'+inner+'</svg>'; }
  function stars(n,seed){
    let s="";
    for(let i=0;i<n;i++){
      const x=((i*137+seed*31)%780)+10, y=((i*89+seed*17)%330)+20, r=(i%3)?2:3.5;
      s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" opacity="${.5+(i%4)/8}"/>`;
    }
    return s;
  }

  /* =========================================================
     ROOMS
     ========================================================= */
  const ROOMS = [

  /* ---------- 1 · Toy Room : tap blocks in the poster's order ---------- */
  {
    name:"Toy Room",
    intro:"Tap things in the room to look at them!",
    locked:"This door needs a key. Look around the room. 🔎",
    draw(){ return svg(`
      <defs><linearGradient id="w1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffe3a8"/><stop offset="1" stop-color="#ffc27a"/></linearGradient></defs>
      <rect width="800" height="600" fill="url(#w1)"/>
      <rect y="440" width="800" height="160" fill="#c98b52"/><rect y="440" width="800" height="14" fill="#a86f3d"/>
      ${sign({go:"clue",x:70,y:90,w:200,h:140,inner:
        '<text x="170" y="150" font-size="26" text-anchor="middle">SECRET</text>'+
        '<text x="170" y="196" font-size="34" text-anchor="middle">🐻 🚀 🐟</text>'})}
      <rect x="330" y="250" width="230" height="16" rx="6" fill="#8a5a2b"/>
      <g class="hot" data-go="puzzle" tabindex="0" role="button" aria-label="toy blocks">
        <rect x="340" y="190" width="60" height="60" rx="10" fill="#ff7eb6"/><text x="370" y="234" font-size="30" text-anchor="middle">🚀</text>
        <rect x="415" y="190" width="60" height="60" rx="10" fill="#5ec8ff"/><text x="445" y="234" font-size="30" text-anchor="middle">🐟</text>
        <rect x="490" y="190" width="60" height="60" rx="10" fill="#3ddc97"/><text x="520" y="234" font-size="30" text-anchor="middle">🐻</text>
      </g>
      <g class="hot" data-go="extra" tabindex="0" role="button" aria-label="rug">
        <ellipse cx="160" cy="500" rx="120" ry="46" fill="#d95f7a"/><ellipse cx="160" cy="500" rx="80" ry="28" fill="#f08aa0"/>
      </g>
      ${door({})}
      <text x="400" y="60" font-size="28" text-anchor="middle" fill="#8a5a2b">Room 1 · Toy Room</text>`);
    },
    clue:()=>open(`<h2>A secret poster</h2><p>Someone drew three friends in a row.</p>
      <div class="clue">🐻 🚀 🐟</div><p>Maybe the toy blocks like this order too?</p>
      <div class="row"><button class="btn" data-close>OK!</button></div>`),
    extra:()=>{ say("Under the rug: just dust bunnies and a lost sock. 🧦"); close(); },
    puzzle(){
      order(["🐻","🚀","🐟"], ()=>solve("🔑","Click-clack! 🎉","The toy box popped open and a golden key was inside."));
      open(`<h2>Tap the blocks in the secret order</h2><p class="clue">🐻 🚀 🐟</p>
        <div class="row">
          <button class="big" data-ord="🚀">🚀</button>
          <button class="big" data-ord="🐟">🐟</button>
          <button class="big" data-ord="🐻">🐻</button>
        </div><p class="msg"></p>
        <div class="row"><button class="btn alt" data-close>Later</button></div>`);
    }
  },

  /* ---------- 2 · Snack Kitchen : count the cookies ---------- */
  {
    name:"Snack Kitchen",
    intro:"A kitchen! Something smells sweet. 🍪",
    locked:"Locked. A key should be hiding in the cold place. ❄️",
    draw(){ return svg(`
      <rect width="800" height="600" fill="#cdeffd"/><rect y="430" width="800" height="170" fill="#9fd2ea"/>
      ${sign({go:"clue",x:90,y:90,w:230,h:140,inner:
        '<text x="205" y="140" font-size="24" text-anchor="middle">How many</text>'+
        '<text x="205" y="176" font-size="24" text-anchor="middle">cookies?</text>'+
        '<text x="205" y="212" font-size="24" text-anchor="middle">🍪 = the code</text>'})}
      <rect x="90" y="360" width="420" height="20" rx="8" fill="#b5762f"/>
      <rect x="120" y="380" width="22" height="110" fill="#96601f"/><rect x="458" y="380" width="22" height="110" fill="#96601f"/>
      <g class="hot" data-go="extra" tabindex="0" role="button" aria-label="cookies on the table">
        <rect x="140" y="290" width="320" height="70" rx="12" fill="#fff3d6" opacity=".9"/>
        <text x="300" y="345" font-size="46" text-anchor="middle">🍪🍪🍪🍪🍪🍪🍪</text>
      </g>
      <g class="hot" data-go="puzzle" tabindex="0" role="button" aria-label="fridge">
        <rect x="400" y="150" width="150" height="280" rx="14" fill="#eef6fa" stroke="#b9cfdb" stroke-width="6"/>
        <rect x="410" y="160" width="130" height="100" rx="8" fill="#dceaf2"/>
        <rect x="524" y="200" width="10" height="40" rx="5" fill="#9bb4c2"/><rect x="524" y="290" width="10" height="60" rx="5" fill="#9bb4c2"/>
        <text x="455" y="215" font-size="30" text-anchor="middle">🧲</text>
      </g>
      ${door({frame:"#4f7fa8",panel:"#6198c2"})}
      <text x="400" y="56" font-size="28" text-anchor="middle" fill="#31627f">Room 2 · Snack Kitchen</text>`);
    },
    clue:()=>open(`<h2>A note</h2><p>"Count the cookies on the table.<br>That number is the code."</p>
      <div class="row"><button class="btn" data-close>Let's count</button></div>`),
    extra:()=>{ say("Count them carefully… then try the fridge lock."); close(); },
    puzzle(){
      S.code=7; S.onDone=()=>solve("🗝️","Ding! 7 cookies! 🎉","A silver key was taped inside the fridge.");
      open(`<h2>Magnet number lock</h2><div class="screen" id="scr">_</div>
        <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>'<button data-num="'+n+'">'+n+'</button>').join("")}</div>
        <div class="row"><button class="btn alt" data-close>Close</button></div>`);
    }
  },

  /* ---------- 3 · Sunny Garden : mix paint to make green ---------- */
  {
    name:"Sunny Garden",
    intro:"Outside at last — but the gate is locked. 🌳",
    locked:"The gate wants a flower-fresh key. Try mixing paint first. 🎨",
    draw(){ return svg(`
      <rect width="800" height="600" fill="#d9f5d0"/><rect y="420" width="800" height="180" fill="#6fbf5b"/>
      <circle cx="120" cy="110" r="52" fill="#ffe066"/><text x="120" y="126" font-size="46" text-anchor="middle">☀️</text>
      ${sign({go:"clue",x:380,y:120,w:240,h:120,edge:"#b98a5e",inner:
        '<text x="500" y="168" font-size="24" text-anchor="middle">Mix the pots</text>'+
        '<text x="500" y="206" font-size="24" text-anchor="middle">to make GREEN</text>'})}
      <g class="hot" data-go="puzzle" tabindex="0" role="button" aria-label="paint pots">
        <rect x="90" y="330" width="260" height="90" rx="12" fill="#b98a5e"/>
        <circle cx="150" cy="330" r="38" fill="#4a8fe0"/><circle cx="230" cy="330" r="38" fill="#ffd93d"/>
        <circle cx="310" cy="330" r="38" fill="#e05a5a"/>
        <text x="220" y="400" font-size="24" text-anchor="middle" fill="#fff">paint pots</text>
      </g>
      <g class="hot" data-go="extra" tabindex="0" role="button" aria-label="flowers">
        <text x="330" y="520" font-size="54">🌷</text><text x="400" y="520" font-size="54">🌻</text>
        <text x="470" y="520" font-size="54">🌸</text>
      </g>
      ${door({frame:"#7a5230",panel:"#8f6138",x:600,y:150,w:170,h:285})}
      <text x="400" y="56" font-size="28" text-anchor="middle" fill="#2f6b23">Room 3 · Sunny Garden</text>`);
    },
    clue:()=>open(`<h2>Garden sign</h2><p>"Mix two paint pots to make <b>GREEN</b>."</p>

      open(`<h2>Vault keypad</h2><div class="screen" id="scr">_</div>
        ${keypad(true)}
        <p class="mini">Three digits, one after another.</p>
        <div class="row"><button class="btn alt" data-close>Close</button></div>`);
    }
  },

  /* ---------- 19 · Potion Lab : fractions ---------- */
  {
    name:"Potion Lab",
    intro:"Bubbling glass, strange smells. Careful what you touch! 🧪",
    locked:"The lab door wants exactly the right measure.",
    draw(){ return svg(`
      <rect width="800" height="600" fill="#20143a"/><rect y="460" width="800" height="140" fill="#33214f"/>
      ${sign({go:"clue",x:70,y:120,w:240,h:130,edge:"#a366d9",inner:
        '<text x="190" y="166" font-size="20" text-anchor="middle">The recipe needs</text>'+
        '<text x="190" y="206" font-size="32" text-anchor="middle">3/4 of a flask</text>'+
        '<text x="190" y="236" font-size="17" text-anchor="middle">three quarters full</text>'})}
      <g class="hot" data-go="puzzle" tabindex="0" role="button" aria-label="flasks">
        <rect x="360" y="250" width="300" height="200" rx="12" fill="#2f1f4d" stroke="#a366d9" stroke-width="5"/>
        ${[[0.5,"#5ec8ff"],[0.75,"#3ddc97"],[0.25,"#ff7eb6"]].map(([f,c],i)=>`
          <rect x="${390+i*90}" y="280" width="52" height="130" rx="10" fill="#dfe8ff" opacity=".25"/>
          <rect x="${390+i*90}" y="${280+130*(1-f)}" width="52" height="${130*f}" rx="10" fill="${c}"/>
          <rect x="${390+i*90}" y="280" width="52" height="130" rx="10" fill="none" stroke="#cfe0ff" stroke-width="4"/>`).join("")}
        <text x="510" y="436" font-size="18" text-anchor="middle" fill="#e6d9ff">potion flasks</text>
      </g>
      <g class="hot" data-go="extra" tabindex="0" role="button" aria-label="cauldron"><text x="160" y="440" font-size="48">⚗️</text></g>
      ${door({frame:"#5b3f8a",panel:"#7d5cb0",x:670,y:200,w:110,h:260})}
      <text x="400" y="56" font-size="28" text-anchor="middle" fill="#e6d9ff">Room 19 · Potion Lab</text>`);
    },
    clue:()=>open(`<h2>The recipe</h2><p>"Pour the flask that is <b>three quarters</b> full — ¾."</p>
      <p class="mini">Imagine the flask cut into 4 equal parts. Three of the four parts should be full.</p>
      <div class="row"><button class="btn" data-close>OK</button></div>`),
    extra:()=>{ say("The cauldron burps a green bubble. It smells like old socks. ⚗️"); close(); },
    puzzle(){
      const flask=(f,c)=>`<svg viewBox="0 0 60 150" width="52" height="120">
        <rect x="4" y="0" width="52" height="150" rx="12" fill="#efe9ff"/>
        <rect x="4" y="${150*(1-f)}" width="52" height="${150*f}" rx="12" fill="${c}"/>
        <line x1="4" y1="37.5" x2="56" y2="37.5" stroke="#fff" stroke-width="2"/>
        <line x1="4" y1="75" x2="56" y2="75" stroke="#fff" stroke-width="2"/>
        <line x1="4" y1="112.5" x2="56" y2="112.5" stroke="#fff" stroke-width="2"/>
        <rect x="4" y="0" width="52" height="150" rx="12" fill="none" stroke="#9c8fd0" stroke-width="4"/></svg>`;
      S.onDone=()=>solve("🧪","Three quarters exactly! 🎉","The potion fizzed green and the lock popped open.");
      open(`<h2>Which flask is ¾ full?</h2>
        <div class="row">
          <button class="big" data-pick="no">${flask(.5,"#5ec8ff")}</button>
          <button class="big" data-pick="ok">${flask(.75,"#3ddc97")}</button>
          <button class="big" data-pick="no">${flask(.25,"#ff7eb6")}</button>
        </div><p class="msg">The white lines cut each flask into 4 equal parts.</p>
        <div class="row"><button class="btn alt" data-close>Later</button></div>`);
    }
  },

  /* ---------- 20 · Dragon's Keep : light every lamp ---------- */
  {
    name:"Dragon's Keep",
    intro:"The very last door. Something enormous is breathing behind you. 🐉",
    locked:"Every lamp must be glowing before the great gate opens.",
    draw(){ return svg(`
      <rect width="800" height="600" fill="#2a1410"/><rect y="470" width="800" height="130" fill="#46231a"/>
      <g class="hot" data-go="puzzle" tabindex="0" role="button" aria-label="five lamps">
        <rect x="290" y="150" width="300" height="18" rx="8" fill="#6b4a2a"/>
        ${[0,1,2,3,4].map(i=>`<line x1="${325+i*60}" y1="168" x2="${325+i*60}" y2="184" stroke="#c9a24a" stroke-width="5"/>
          <circle cx="${325+i*60}" cy="210" r="26" fill="#3a2a22" stroke="#c9a24a" stroke-width="5"/>
          <circle cx="${325+i*60}" cy="210" r="11" fill="#5a4436"/>`).join("")}
        <text x="445" y="272" font-size="19" text-anchor="middle" fill="#ffd9a8">five lamps — all dark</text>
      </g>
      ${sign({go:"clue",x:70,y:150,w:200,h:130,edge:"#c9a24a",inner:
        '<text x="170" y="196" font-size="19" text-anchor="middle">Touch one lamp</text>'+
        '<text x="170" y="226" font-size="19" text-anchor="middle">and its neighbours</text>'+
        '<text x="170" y="256" font-size="19" text-anchor="middle">change too!</text>'})}
      <g class="hot" data-go="extra" tabindex="0" role="button" aria-label="sleeping dragon">
        <path d="M420 500 Q520 430 600 520" stroke="#6e2626" stroke-width="22" fill="none" stroke-linecap="round"/>
        <ellipse cx="300" cy="500" rx="145" ry="62" fill="#8a2f2f"/>
        <path d="M250 450 L300 360 L350 450Z" fill="#c4443f"/>
        <path d="M320 455 L365 385 L400 455Z" fill="#a83a35"/>
        <path d="M170 470 Q120 470 110 430 Q140 405 185 425Z" fill="#8a2f2f"/>
        <ellipse cx="135" cy="447" rx="52" ry="34" fill="#9c3636"/>
        <path d="M120 420 L112 396" stroke="#e8c07a" stroke-width="7" stroke-linecap="round"/>
        <path d="M148 418 L146 393" stroke="#e8c07a" stroke-width="7" stroke-linecap="round"/>
        <path d="M112 440 q10 -6 20 0" stroke="#3a1414" stroke-width="5" fill="none" stroke-linecap="round"/>
        <ellipse cx="92" cy="455" rx="9" ry="6" fill="#3a1414"/>
        <text x="150" y="370" font-size="28">💤</text>
      </g>
      <g aria-hidden="true">
        <ellipse cx="620" cy="520" rx="80" ry="22" fill="#c9a24a" opacity=".55"/>
        <text x="596" y="530" font-size="30">🪙</text><text x="636" y="522" font-size="24">💎</text>
      </g>
      ${door({frame:"#6b4a2a",panel:"#8a6234",x:610,y:140,w:180,h:330})}
      <text x="400" y="56" font-size="28" text-anchor="middle" fill="#ffd9a8">Room 20 · Dragon's Keep</text>`);
    },
    clue:()=>open(`<h2>The rune stone</h2>
      <p>"Touching a lamp flips that lamp <b>and the lamps beside it</b>.<br>Make all five glow."</p>
      <p class="mini">Tip: think about which lamps you touch, not how many times.</p>
      <div class="row"><button class="btn" data-close>Brave!</button></div>`),
    extra:()=>{ say("The dragon snores, and a puff of smoke rings floats up. Do NOT wake it. 🐉"); close(); },
    puzzle(){
      S.lamps=[0,0,0,0,0];
      S.onDone=()=>solve("🐲","Every lamp is glowing! 🎉","The great gate grinds open. The dragon sleeps on.");
      open(`<h2>Make all five lamps glow</h2>
        <div class="lamps" id="lampbox"></div>
        <p class="msg">Touching a lamp flips its neighbours too.</p>
        <div class="row"><button class="btn ghost" data-lampreset>Start over</button>
          <button class="btn alt" data-close>Later</button></div>`);
      drawLamps();
    }
  }
  ];

  /* ---------- lantern memory playback (rooms 9 and 13) ---------- */
  function playSeq(){
    if(S.busy) return;
    S.busy=true; S.got=[];
    card.querySelectorAll("[data-ord]").forEach(b=>b.classList.remove("picked"));
    msg("Watch carefully…");
    S.seq.forEach((c,i)=>{
      setTimeout(()=>{
        const b=card.querySelector('[data-lan="'+c+'"]'); if(!b) return;
        b.classList.add("lit");
        setTimeout(()=>b.classList.remove("lit"),480);
      }, 500+i*750);
    });
    setTimeout(()=>{ S.busy=false; if(card.querySelector(".msg")) msg("Now you try!"); }, 500+S.seq.length*750+200);
  }

  /* ---------- paint mixing (room 3) ---------- */
  function potTap(b){
    const p=b.dataset.pot;
    if(S.picked.includes(p)) return;
    S.picked.push(p); b.classList.add("picked");
    if(S.picked.length<2){ msg("…and one more!"); return; }
    if(S.picked.includes("blue") && S.picked.includes("yellow")) setTimeout(S.onDone,300);
    else{
      wrong(); msg("That makes another color. Try again!");
      S.picked=[]; card.querySelectorAll("[data-pot]").forEach(x=>x.classList.remove("picked"));
    }
  }

  /* ---------- clock hands (room 11) ---------- */
  function clockFace(h,m){
    const ha=((h%12)*30+m*0.5-90)*Math.PI/180, ma=(m*6-90)*Math.PI/180;
    const ticks=[...Array(12)].map((_,i)=>{
      const a=(i*30-90)*Math.PI/180;
      return `<text x="${100+74*Math.cos(a)}" y="${107+74*Math.sin(a)}" font-size="17"
                text-anchor="middle" fill="#2b2340">${i===0?12:i}</text>`;
    }).join("");
    return `<svg viewBox="0 0 200 200" width="190" height="190" aria-label="clock face">
      <circle cx="100" cy="100" r="94" fill="#fffbee" stroke="#c9a24a" stroke-width="8"/>${ticks}
      <line x1="100" y1="100" x2="${100+46*Math.cos(ha)}" y2="${100+46*Math.sin(ha)}"
            stroke="#2b2340" stroke-width="10" stroke-linecap="round"/>
      <line x1="100" y1="100" x2="${100+70*Math.cos(ma)}" y2="${100+70*Math.sin(ma)}"
            stroke="#d9558c" stroke-width="6" stroke-linecap="round"/>
      <circle cx="100" cy="100" r="8" fill="#2b2340"/></svg>`;
  }
  function drawClock(){
    const box=$("clockbox"); if(!box) return;
    box.innerHTML=clockFace(S.ch,S.cm);
    $("clocktime").textContent=S.ch+":"+String(S.cm).padStart(2,"0");
  }
  function clkTap(b){
    if(b.dataset.clk==="h") S.ch = S.ch%12 + 1;
    else S.cm = (S.cm + 5) % 60;
    drawClock();
    if(S.ch===3 && S.cm===30) setTimeout(S.onDone,350);
  }

  /* ---------- robot programming (room 14) ---------- */
  const ARROW={u:"⬆️",d:"⬇️",l:"⬅️",r:"➡️"};
  function drawRobot(){
    const g=$("rgrid"); if(!g) return;
    let h="";
    for(let r=0;r<4;r++) for(let c=0;c<4;c++){
      const wall=S.walls.some(w=>w[0]===c&&w[1]===r);
      const bot=S.rp[0]===c&&S.rp[1]===r, goal=(c===3&&r===0);
      h+='<div class="'+(wall?"wall":"")+'">'+(bot?"🤖":goal?"🚩":"")+'</div>';
    }
    g.innerHTML=h;
    $("rqueue").textContent = S.rq.length ? S.rq.map(d=>ARROW[d]).join(" ") : "(no moves yet)";
  }
  function resetRobot(){ S.rp=[0,3]; S.rq=[]; drawRobot(); }
  function cmdTap(b){
    const c=b.dataset.cmd;
    if(c==="clear") return resetRobot();
    if(c==="run")   return runRobot();
    if(S.rq.length>=10) return msg("That is a very long plan! Clear it and try a shorter one.");
    S.rq.push(c); drawRobot(); msg("");
  }
  function runRobot(){
    if(S.busy || !S.rq.length) return msg("Give the robot some moves first!");
    S.busy=true; S.rp=[0,3]; drawRobot();
    let i=0;
    const tick=()=>{
      if(i>=S.rq.length){
        S.busy=false;
        if(S.rp[0]===3 && S.rp[1]===0) return void setTimeout(S.onDone,300);
        msg("The robot stopped short of the flag. Try again!"); resetRobot(); return;
      }
      const d=S.rq[i++];
      const nc=S.rp[0]+(d==="r"?1:d==="l"?-1:0), nr=S.rp[1]+(d==="d"?1:d==="u"?-1:0);
      if(nc<0||nc>3||nr<0||nr>3||S.walls.some(w=>w[0]===nc&&w[1]===nr)){
        S.busy=false; wrong(); msg("Bonk! The robot hit a wall."); resetRobot(); return;
      }
      S.rp=[nc,nr]; drawRobot();
      setTimeout(tick,380);
    };
    msg("Running…"); setTimeout(tick,250);
  }

  /* ---------- mirror symmetry (room 15) ---------- */
  function drawMirror(){
    const g=$("mgrid"); if(!g) return;
    let h="";
    for(let r=0;r<4;r++){
      h+='<div class="'+(S.pat[r][0]?"on":"")+'"></div>';
      h+='<div class="'+(S.pat[r][1]?"on":"")+'"></div>';
      h+='<button class="'+(S.mg[r][0]?"on":"")+'" data-cell="'+r+'-0" aria-label="tile"></button>';
      h+='<button class="'+(S.mg[r][1]?"on":"")+'" data-cell="'+r+'-1" aria-label="tile"></button>';
    }
    g.innerHTML=h;
  }
  function cellTap(b){
    const [r,c]=b.dataset.cell.split("-").map(Number);
    S.mg[r][c]=S.mg[r][c]?0:1;
    drawMirror();
    // column 2 mirrors column 1, column 3 mirrors column 0
    const done=S.pat.every((row,r)=>S.mg[r][0]===row[1] && S.mg[r][1]===row[0]);
    if(done) setTimeout(S.onDone,300); else msg("Keep going…");
  }

  /* ---------- lamps (room 20) ---------- */
  function drawLamps(){
    const box=$("lampbox"); if(!box) return;
    box.innerHTML=S.lamps.map((v,i)=>
      '<button class="'+(v?"on":"")+'" data-lamp="'+i+'" aria-label="lamp '+(i+1)+'">'+(v?"💡":"🕯️")+'</button>'
    ).join("");
  }
  function lampTap(b){
    const i=+b.dataset.lamp;
    [i-1,i,i+1].forEach(j=>{ if(j>=0&&j<S.lamps.length) S.lamps[j]=S.lamps[j]?0:1; });
    drawLamps();
    if(S.lamps.every(v=>v)) setTimeout(S.onDone,350);
    else msg(S.lamps.filter(v=>v).length+" of 5 glowing");
  }

  /* ---------- rendering & flow ---------- */
  function render(){
    const R=ROOMS[S.room];
    stage.innerHTML = R.draw();
    $("roomname").textContent = R.name;
    drawProgress();
    stage.querySelectorAll(".hot").forEach(el=>{
      const go=el.dataset.go;
      const run=()=>{ if(go==="door") doorTap(); else R[go] && R[go](); };
      el.addEventListener("click", run);
      el.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); run(); } });
    });
  }

  function doorTap(){
    const R=ROOMS[S.room];
    if(!S.solved[S.room]){
      open('<h2>Locked!</h2><p>'+R.locked+'</p><div class="row"><button class="btn" data-close>OK</button></div>');
      return;
    }
    S.keys++; drawProgress(); confetti();
    if(S.room===ROOMS.length-1){ finish(); return; }
    S.furthest=Math.max(S.furthest,S.room+1); save();
    open('<h2>⭐ Star key '+S.keys+' of '+ROOMS.length+'!</h2>'+
      '<p>The door swings open…</p>'+
      '<div class="row"><button class="btn" data-next>Next room →</button></div>');
  }

  function finish(){
    const rows=[];
    for(let i=0;i<ROOMS.length;i+=5) rows.push("⭐".repeat(Math.min(5,ROOMS.length-i)));
    open('<h2>🎉 YOU ESCAPED! 🎉</h2><div style="font-size:38px">'+rows.join("<br>")+'</div>'+
      '<p>All '+ROOMS.length+' rooms, all '+ROOMS.length+' star keys. You are a real escape hero!</p>'+
      '<div class="row"><button class="btn" data-again>Play again</button></div>');
    say("You escaped every room! Amazing work. 🦊");
  }

  function goRoom(n){
    S.room=n; S.want=[]; S.got=[]; S.picked=[]; S.code=null; S.busy=false;
    S.showGot=false; S.codeLen=1; S.entry="";
    close(); render(); say(ROOMS[n].intro);
    if(ROOMS[n].banner)
      open('<h2>'+ROOMS[n].banner+'</h2><p>Same idea as before: find the clue, solve the puzzle, '+
           'open the door — the puzzles just ask you to think a bit harder.</p>'+
           '<div class="row"><button class="btn" data-close>Bring it on!</button></div>');
  }

  function reset(){
    S.keys=0; S.bag=[]; S.solved={}; drawBag(); goRoom(0);
  }

  function startScreen(){
    const canResume = S.furthest>0;
    open('<h2>⭐ Star Key Escape</h2>'+
      '<p>'+ROOMS.length+' rooms, '+ROOMS.length+' star keys. Rooms 1–10 are gentle; '+
      'rooms 11–20 are for bigger kids.</p>'+
      '<div class="map">'+ROOMS.map((r,i)=>'<b'+(i<=S.furthest?' class="done"':'')+'>'+(i+1)+'</b>').join("")+'</div>'+
      '<div class="row">'+
        (canResume?'<button class="btn" data-resume>Continue — Room '+(S.furthest+1)+'</button>':'')+
        '<button class="'+(canResume?'btn ghost':'btn')+'" data-start>Start from Room 1</button>'+
      '</div>');
  }

  /* ---------- one delegated click handler for every popup button ---------- */
  card.addEventListener("click", e=>{
    const b=e.target.closest("button"); if(!b) return;
    if(b.hasAttribute("data-close"))  return close();
    if(b.hasAttribute("data-next"))   return goRoom(S.room+1);
    if(b.hasAttribute("data-again"))  return reset();
    if(b.hasAttribute("data-start"))  return reset();
    if(b.hasAttribute("data-resume")){ S.keys=S.furthest; S.bag=[]; S.solved={}; drawBag(); return goRoom(S.furthest); }
    if(b.hasAttribute("data-replay")) return playSeq();
    if(b.dataset.cmd !== undefined)  return cmdTap(b);        // Run / Clear need to work mid-run
    if(S.busy) return;                       // ignore taps while a sequence is playing
    if(b.hasAttribute("data-wipe")){ S.entry=""; $("scr").textContent="_"; return; }
    if(b.hasAttribute("data-lampreset")){ S.lamps=[0,0,0,0,0]; drawLamps(); return msg(""); }
    if(b.dataset.ord  !== undefined) return ordTap(b);
    if(b.dataset.pick !== undefined) return pickTap(b);
    if(b.dataset.num  !== undefined) return numTap(b);
    if(b.dataset.pot  !== undefined) return potTap(b);
    if(b.dataset.clk  !== undefined) return clkTap(b);
    if(b.dataset.cell !== undefined) return cellTap(b);
    if(b.dataset.lamp !== undefined) return lampTap(b);
  });
  scrim.addEventListener("click", e=>{
    if(e.target!==scrim) return;
    if(card.querySelector("[data-start]")) return;   // the start screen must be answered
    close();
  });
  document.addEventListener("keydown", e=>{
    if(e.key==="Escape" && !scrim.hidden && !card.querySelector("[data-start]")) close();
  });

  /* ---------- boot ---------- */
  loadSave(); drawBag(); render(); startScreen();
})();
</script>
</body>
</html>

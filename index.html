<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Key Escape — a room escape game for kids</title>
<meta name="description" content="A friendly three-room escape game for kids. Find the clues, solve the puzzles, collect the star keys.">
<style>
  *,*::before,*::after{box-sizing:border-box}
  [hidden]{display:none !important}
  :root{
    --bg:#1a1033; --bg2:#2a1b52; --panel:#fffdf7; --ink:#2b2340;
    --gold:#ffc93c; --pink:#ff7eb6; --mint:#3ddc97; --sky:#5ec8ff;
    --shadow:0 8px 0 rgba(0,0,0,.18);
  }
  html,body{height:100%}
  body{
    margin:0; font-family:"Baloo 2",Verdana,"Trebuchet MS",system-ui,sans-serif;
    background:radial-gradient(120% 90% at 50% 0%,var(--bg2),var(--bg));
    color:var(--ink); min-height:100%; padding:12px;
    display:flex; flex-direction:column; align-items:center; gap:12px;
  }
  h1,h2,h3{margin:0}
  button{font:inherit; cursor:pointer; border:none; background:none; color:inherit}

  .wrap{width:100%; max-width:900px; display:flex; flex-direction:column; gap:12px}

  header.hud{
    display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    background:var(--panel); border-radius:18px; padding:10px 14px; box-shadow:var(--shadow);
  }
  .title{font-size:20px; font-weight:800; letter-spacing:.5px}
  .title .star{color:#e8a300}
  .roomname{font-size:15px; background:#efe9ff; border-radius:999px; padding:4px 12px; font-weight:700}
  .keys{margin-left:auto; display:flex; gap:6px; align-items:center; font-size:22px}
  .keys .slot{opacity:.22; transition:transform .3s, opacity .3s}
  .keys .slot.on{opacity:1; transform:scale(1.25) rotate(-8deg)}

  /* ---- stage ---- */
  .stage{position:relative; width:100%; aspect-ratio:4/3; max-height:62vh;
    border-radius:22px; overflow:hidden; box-shadow:var(--shadow); background:#000}
  .stage svg{position:absolute; inset:0; width:100%; height:100%; display:block}
  .hot{cursor:pointer}
  .hot:hover{filter:brightness(1.12) drop-shadow(0 0 8px rgba(255,255,255,.85))}
  .hot:focus-visible{outline:3px solid #fff; outline-offset:2px}

  /* ---- say bar ---- */
  .say{background:var(--panel); border-radius:18px; padding:12px 16px; box-shadow:var(--shadow);
    font-size:17px; font-weight:700; min-height:56px; display:flex; align-items:center; gap:10px}
  .say .face{font-size:24px}

  /* ---- bag ---- */
  .bag{display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    background:rgba(255,255,255,.12); border-radius:18px; padding:8px 12px; color:#fff}
  .bag .label{font-weight:800; font-size:14px; letter-spacing:1px; opacity:.85}
  .item{font-size:24px; background:var(--panel); border-radius:12px; padding:4px 8px; box-shadow:0 3px 0 rgba(0,0,0,.25)}
  .item:hover{transform:translateY(-2px)}

  /* ---- modal ---- */
  .scrim{position:fixed; inset:0; background:rgba(12,6,30,.72); display:flex;
    align-items:center; justify-content:center; padding:16px; z-index:20}
  .card{background:var(--panel); border-radius:24px; padding:20px; width:min(460px,100%);
    box-shadow:0 12px 0 rgba(0,0,0,.3); text-align:center}
  .card h2{font-size:22px; margin-bottom:6px}
  .card p{font-size:16px; margin:8px 0 14px}
  .btn{background:var(--mint); color:#0d3a29; font-weight:800; border-radius:999px;
    padding:10px 22px; box-shadow:0 4px 0 #23a874; font-size:17px}
  .btn:active{transform:translateY(3px); box-shadow:0 1px 0 #23a874}
  .btn.alt{background:var(--sky); box-shadow:0 4px 0 #2a92c9; color:#06364f}

  /* puzzle bits */
  .pad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:10px auto; max-width:260px}
  .pad button{background:#efe9ff; border-radius:14px; padding:12px 0; font-size:22px; font-weight:800;
    box-shadow:0 4px 0 #cdc2f0}
  .pad button:active{transform:translateY(3px); box-shadow:0 1px 0 #cdc2f0}
  .screen{font-size:34px; letter-spacing:10px; font-weight:800; background:#2b2340; color:var(--gold);
    border-radius:14px; padding:8px; min-height:52px}
  .row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:10px 0}
  .big{font-size:40px; background:#efe9ff; border-radius:18px; padding:10px 14px; box-shadow:0 5px 0 #cdc2f0}
  .big:active{transform:translateY(3px); box-shadow:0 2px 0 #cdc2f0}
  .big.picked{outline:4px solid var(--pink)}
  .clue{font-size:34px; letter-spacing:6px}
  .shake{animation:sh .4s}
  @keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .pop{animation:pp .5s}
  @keyframes pp{50%{transform:scale(1.18)}}

  .conf{position:fixed; inset:0; pointer-events:none; z-index:30; overflow:hidden}
  .conf i{position:absolute; top:-24px; font-size:22px; animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

  @media (max-width:520px){
    .title{font-size:17px} .say{font-size:15px} .stage{max-height:48vh}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hud">
    <div class="title"><span class="star">★</span> Star Key Escape</div>
    <div class="roomname" id="roomname">Toy Room</div>
    <div class="keys" aria-label="star keys collected">
      <span class="slot" id="k0">⭐</span><span class="slot" id="k1">⭐</span><span class="slot" id="k2">⭐</span>
    </div>
  </header>

  <div class="stage" id="stage"></div>

  <div class="say"><span class="face">🦊</span><span id="say">Tap things in the room to look at them!</span></div>

  <div class="bag"><span class="label">BAG</span><span id="bag"></span></div>
</div>

<div class="conf" id="conf" hidden></div>
<div class="scrim" id="scrim" hidden><div class="card" id="card"></div></div>

<script>
(function(){
  "use strict";
  const $ = id => document.getElementById(id);
  const stage=$("stage"), scrim=$("scrim"), card=$("card");

  const S = {
    room:0,
    keys:0,
    bag:[],                 // emoji strings
    blockOrder:[],          // room 1 progress
    drawerOpen:false,
    room1Done:false,
    cookieCount:null,
    room2Done:false,
    mixed:false,
    room3Done:false
  };

  /* ---------- helpers ---------- */
  function say(t){ $("say").textContent = t; }
  function give(item,msg){
    if(!S.bag.includes(item)) S.bag.push(item);
    drawBag(); say(msg);
  }
  function drawBag(){
    $("bag").innerHTML = S.bag.length
      ? S.bag.map(e=>'<span class="item">'+e+'</span>').join("")
      : '<span style="opacity:.7;font-size:14px">empty</span>';
  }
  function addKey(){
    $("k"+S.keys).classList.add("on"); S.keys++;
  }
  function close(){ scrim.hidden = true; card.innerHTML=""; }
  function open(html){ card.innerHTML = html; scrim.hidden = false; }
  function wrong(){
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
  }
  function confetti(){
    const c=$("conf"); c.hidden=false; c.innerHTML="";
    const bits=["🎉","⭐","🎈","✨","🌟","🎊"];
    for(let i=0;i<40;i++){
      const s=document.createElement("i");
      s.textContent=bits[i%bits.length];
      s.style.left=Math.random()*100+"%";
      s.style.animationDuration=(2+Math.random()*2.5)+"s";
      s.style.animationDelay=(Math.random()*1.2)+"s";
      c.appendChild(s);
    }
    setTimeout(()=>{c.hidden=true; c.innerHTML="";},6000);
  }

  /* ---------- rooms ---------- */
  // Each room returns SVG markup. Hotspots carry data-go="handlerName".
  function svg(inner){
    return '<svg viewBox="0 0 800 600" role="img" aria-label="room">'+inner+'</svg>';
  }

  function room1(){
    return svg(`
      <defs><linearGradient id="w1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffe3a8"/><stop offset="1" stop-color="#ffc27a"/></linearGradient></defs>
      <rect width="800" height="600" fill="url(#w1)"/>
      <rect y="440" width="800" height="160" fill="#c98b52"/>
      <rect y="440" width="800" height="14" fill="#a86f3d"/>

      <!-- door -->
      <g class="hot" data-go="door1" tabindex="0" role="button" aria-label="door">
        <rect x="600" y="180" width="150" height="262" rx="10" fill="#8a5a2b"/>
        <rect x="616" y="196" width="118" height="230" rx="8" fill="#a06b35"/>
        <circle cx="628" cy="320" r="9" fill="#ffd85e"/>
        <rect x="640" y="240" width="70" height="48" rx="8" fill="#3a2b16"/>
        <text x="675" y="274" font-size="30" text-anchor="middle" fill="#ffd85e">⭐</text>
      </g>

      <!-- poster clue -->
      <g class="hot" data-go="poster" tabindex="0" role="button" aria-label="poster">
        <rect x="70" y="90" width="200" height="140" rx="10" fill="#fff8e8" stroke="#d8b27a" stroke-width="6"/>
        <text x="170" y="150" font-size="26" text-anchor="middle">SECRET</text>
        <text x="170" y="196" font-size="34" text-anchor="middle">🐻 🚀 🐟</text>
      </g>

      <!-- shelf with blocks -->
      <rect x="330" y="250" width="230" height="16" rx="6" fill="#8a5a2b"/>
      <g class="hot" data-go="blocks" tabindex="0" role="button" aria-label="toy blocks">
        <rect x="340" y="190" width="60" height="60" rx="10" fill="#ff7eb6"/>
        <text x="370" y="234" font-size="30" text-anchor="middle">🚀</text>
        <rect x="415" y="190" width="60" height="60" rx="10" fill="#5ec8ff"/>
        <text x="445" y="234" font-size="30" text-anchor="middle">🐟</text>
        <rect x="490" y="190" width="60" height="60" rx="10" fill="#3ddc97"/>
        <text x="520" y="234" font-size="30" text-anchor="middle">🐻</text>
      </g>

      <!-- toy box / drawer -->
      <g class="hot" data-go="drawer" tabindex="0" role="button" aria-label="toy box">
        <rect x="330" y="330" width="230" height="115" rx="14" fill="#ff9f5a"/>
        <rect x="350" y="${S.drawerOpen?368:352}" width="190" height="${S.drawerOpen?70:54}" rx="10" fill="#ffd08a"/>
        <rect x="420" y="${S.drawerOpen?392:372}" width="50" height="12" rx="6" fill="#a86f3d"/>
        ${S.drawerOpen && !S.bag.includes("🔑") ? '<text x="445" y="392" font-size="34" text-anchor="middle">🔑</text>' : ''}
      </g>

      <!-- rug -->
      <g class="hot" data-go="rug" tabindex="0" role="button" aria-label="rug">
        <ellipse cx="160" cy="500" rx="120" ry="46" fill="#d95f7a"/>
        <ellipse cx="160" cy="500" rx="80" ry="28" fill="#f08aa0"/>
      </g>
      <text x="400" y="60" font-size="30" text-anchor="middle" fill="#8a5a2b">Room 1 · Toy Room</text>
    `);
  }

  function room2(){
    return svg(`
      <rect width="800" height="600" fill="#cdeffd"/>
      <rect y="430" width="800" height="170" fill="#9fd2ea"/>
      <rect x="0" y="300" width="800" height="130" fill="#7fb7d6" opacity=".35"/>

      <g class="hot" data-go="door2" tabindex="0" role="button" aria-label="door">
        <rect x="610" y="170" width="150" height="262" rx="10" fill="#4f7fa8"/>
        <rect x="626" y="186" width="118" height="230" rx="8" fill="#6198c2"/>
        <circle cx="638" cy="310" r="9" fill="#ffd85e"/>
        <rect x="650" y="230" width="70" height="48" rx="8" fill="#1d3448"/>
        <text x="685" y="264" font-size="30" text-anchor="middle" fill="#ffd85e">⭐</text>
      </g>

      <!-- table with cookies -->
      <rect x="90" y="360" width="420" height="20" rx="8" fill="#b5762f"/>
      <rect x="120" y="380" width="22" height="110" fill="#96601f"/>
      <rect x="458" y="380" width="22" height="110" fill="#96601f"/>
      <g class="hot" data-go="cookies" tabindex="0" role="button" aria-label="cookies on the table">
        <rect x="140" y="290" width="320" height="70" rx="12" fill="#fff3d6" opacity=".9"/>
        <text x="300" y="345" font-size="46" text-anchor="middle">🍪🍪🍪🍪🍪🍪🍪</text>
      </g>

      <!-- note -->
      <g class="hot" data-go="note2" tabindex="0" role="button" aria-label="note on the wall">
        <rect x="100" y="90" width="230" height="140" rx="10" fill="#fffbee" stroke="#d0b98a" stroke-width="6"/>
        <text x="215" y="140" font-size="24" text-anchor="middle">How many</text>
        <text x="215" y="176" font-size="24" text-anchor="middle">cookies?</text>
        <text x="215" y="212" font-size="24" text-anchor="middle">🍪 = the code</text>
      </g>

      <!-- fridge -->
      <g class="hot" data-go="fridge" tabindex="0" role="button" aria-label="fridge">
        <rect x="400" y="150" width="150" height="280" rx="14" fill="#eef6fa" stroke="#b9cfdb" stroke-width="6"/>
        <rect x="410" y="160" width="130" height="100" rx="8" fill="#dceaf2"/>
        <rect x="524" y="200" width="10" height="40" rx="5" fill="#9bb4c2"/>
        <rect x="524" y="290" width="10" height="60" rx="5" fill="#9bb4c2"/>
        <text x="455" y="215" font-size="30" text-anchor="middle">🧲</text>
      </g>
      <text x="400" y="56" font-size="30" text-anchor="middle" fill="#31627f">Room 2 · Snack Kitchen</text>
    `);
  }

  function room3(){
    return svg(`
      <rect width="800" height="600" fill="#d9f5d0"/>
      <rect y="420" width="800" height="180" fill="#6fbf5b"/>
      <circle cx="120" cy="110" r="52" fill="#ffe066"/>
      <text x="120" y="126" font-size="46" text-anchor="middle">☀️</text>

      <g class="hot" data-go="door3" tabindex="0" role="button" aria-label="big gate">
        <rect x="580" y="140" width="180" height="292" rx="14" fill="#7a5230"/>
        <rect x="598" y="158" width="144" height="256" rx="10" fill="#8f6138"/>
        <rect x="620" y="210" width="100" height="64" rx="10" fill="#2c1d10"/>
        <text x="670" y="258" font-size="40" text-anchor="middle" fill="#ffd85e">⭐⭐⭐</text>
        <circle cx="608" cy="300" r="10" fill="#ffd85e"/>
      </g>

      <g class="hot" data-go="paints" tabindex="0" role="button" aria-label="paint pots">
        <rect x="90" y="330" width="260" height="90" rx="12" fill="#b98a5e"/>
        <circle cx="150" cy="330" r="38" fill="#4a8fe0"/>
        <circle cx="230" cy="330" r="38" fill="#ffd93d"/>
        <circle cx="310" cy="330" r="38" fill="#e05a5a"/>
        <text x="220" y="400" font-size="26" text-anchor="middle" fill="#fff">paint pots</text>
      </g>

      <g class="hot" data-go="flowers" tabindex="0" role="button" aria-label="flowers">
        <text x="420" y="500" font-size="54">🌷</text>
        <text x="480" y="500" font-size="54">🌻</text>
        <text x="540" y="500" font-size="54">🌸</text>
      </g>

      <g class="hot" data-go="sign" tabindex="0" role="button" aria-label="garden sign">
        <rect x="380" y="120" width="240" height="120" rx="10" fill="#fffbee" stroke="#b98a5e" stroke-width="6"/>
        <text x="500" y="168" font-size="24" text-anchor="middle">Mix the pots</text>
        <text x="500" y="206" font-size="24" text-anchor="middle">to make GREEN</text>
        <rect x="486" y="240" width="28" height="70" fill="#b98a5e"/>
      </g>
      <text x="400" y="56" font-size="30" text-anchor="middle" fill="#2f6b23">Room 3 · Sunny Garden</text>
    `);
  }

  const ROOMS = [
    {name:"Toy Room", draw:room1},
    {name:"Snack Kitchen", draw:room2},
    {name:"Sunny Garden", draw:room3}
  ];

  function render(){
    stage.innerHTML = ROOMS[S.room].draw();
    $("roomname").textContent = ROOMS[S.room].name;
    stage.querySelectorAll(".hot").forEach(el=>{
      const go = el.dataset.go;
      el.addEventListener("click", ()=>H[go]());
      el.addEventListener("keydown", e=>{
        if(e.key==="Enter"||e.key===" "){ e.preventDefault(); H[go](); }
      });
    });
  }

  /* ---------- hotspot handlers ---------- */
  const H = {};

  /* --- Room 1 --- */
  H.poster = ()=> open(`
    <h2>A secret poster</h2>
    <p>Someone drew three friends in a row.</p>
    <div class="clue">🐻 🚀 🐟</div>
    <p>Maybe the toy blocks like this order too?</p>
    <div class="row"><button class="btn" data-close>OK!</button></div>`);

  H.rug = ()=>{
    if(S.bag.includes("📄")){ say("Just a soft rug now. Nothing else under it."); return; }
    give("📄","You peeked under the rug and found a little paper!");
    open(`<h2>Under the rug…</h2><div style="font-size:52px">📄</div>
      <p>It says: <b>"Blocks first. Then the box opens."</b></p>
      <div class="row"><button class="btn" data-close>Got it</button></div>`);
  };

  H.blocks = ()=>{
    if(S.drawerOpen){ open(`<h2>Toy blocks</h2><p>They already did their magic. ✨</p>
      <div class="row"><button class="btn" data-close>OK</button></div>`); return; }
    S.blockOrder = [];
    open(`<h2>Tap the blocks in the secret order</h2>
      <p class="clue">🐻 🚀 🐟</p>
      <div class="row">
        <button class="big" data-blk="🚀">🚀</button>
        <button class="big" data-blk="🐟">🐟</button>
        <button class="big" data-blk="🐻">🐻</button>
      </div>
      <p id="prog" style="font-size:28px;min-height:34px"></p>
      <div class="row"><button class="btn alt" data-close>Later</button></div>`);
  };

  function blockTap(e){
    const v=e.currentTarget.dataset.blk;
    const want=["🐻","🚀","🐟"];
    S.blockOrder.push(v);
    e.currentTarget.classList.remove("pop"); void e.currentTarget.offsetWidth;
    e.currentTarget.classList.add("pop");
    const i=S.blockOrder.length-1;
    if(S.blockOrder[i]!==want[i]){
      S.blockOrder=[]; $("prog").textContent="❌ oops — try again!"; wrong(); return;
    }
    $("prog").textContent = S.blockOrder.join(" ");
    if(S.blockOrder.length===3){
      S.drawerOpen=true; confetti();
      setTimeout(()=>{
        open(`<h2>Click-clack! 🎉</h2><p>The toy box slid open. Something shiny is inside!</p>
          <div class="row"><button class="btn" data-close>Look inside</button></div>`);
        render(); say("The toy box popped open. Tap it!");
      },450);
    }
  }

  H.drawer = ()=>{
    if(!S.drawerOpen){
      open(`<h2>Toy box</h2><p>It is stuck shut. There must be a trick to open it.</p>
        <div class="row"><button class="btn" data-close>Hmm…</button></div>`); return;
    }
    if(!S.bag.includes("🔑")){
      give("🔑","You found a golden key! Try the door.");
      open(`<h2>A golden key!</h2><div style="font-size:56px">🔑</div>
        <p>Straight into your bag.</p>
        <div class="row"><button class="btn" data-close>Yay!</button></div>`);
    } else {
      open(`<h2>Toy box</h2><p>Empty now — just fluff and a lost sock. 🧦</p>
        <div class="row"><button class="btn" data-close>OK</button></div>`);
    }
  };

  H.door1 = ()=>{
    if(!S.bag.includes("🔑")){
      open(`<h2>Locked!</h2><p>This door needs a key. Look around the room. 🔎</p>
        <div class="row"><button class="btn" data-close>OK</button></div>`); return;
    }
    winRoom("🔑 Click! The door swings open.","You used the golden key!");
  };

  /* --- Room 2 --- */
  H.note2 = ()=> open(`<h2>A note</h2>
    <p>"Count the cookies on the table.<br>That number is the code."</p>
    <div class="row"><button class="btn" data-close>Let's count</button></div>`);

  H.cookies = ()=>{
    open(`<h2>Cookies!</h2>
      <div style="font-size:34px">🍪🍪🍪🍪🍪🍪🍪</div>
      <p>Count them carefully… then check the fridge magnet lock.</p>
      <div class="row"><button class="btn" data-close>Counted!</button></div>`);
    say("Count the cookies, then try the fridge.");
  };

  H.fridge = ()=>{
    if(S.bag.includes("🗝️")){
      open(`<h2>Fridge</h2><p>Only milk and broccoli in here. 🥦</p>
        <div class="row"><button class="btn" data-close>OK</button></div>`); return;
    }
    open(`<h2>Magnet number lock</h2>
      <div class="screen" id="scr">_</div>
      <div class="pad">
        ${[1,2,3,4,5,6,7,8,9].map(n=>'<button data-num="'+n+'">'+n+'</button>').join("")}
      </div>
      <div class="row"><button class="btn alt" data-close>Close</button></div>`);
  };

  function numTap(e){
    const n=+e.currentTarget.dataset.num;
    $("scr").textContent=String(n);
    if(n===7){
      confetti();
      setTimeout(()=>{
        give("🗝️","The fridge opened — a silver key was taped inside!");
        open(`<h2>Ding! 7 cookies! 🎉</h2><div style="font-size:56px">🗝️</div>
          <p>A silver key was hiding in the fridge.</p>
          <div class="row"><button class="btn" data-close>Take it</button></div>`);
      },400);
    } else {
      wrong(); $("scr").textContent="✖";
      setTimeout(()=>{ const s=$("scr"); if(s) s.textContent="_"; },700);
    }
  }

  H.door2 = ()=>{
    if(!S.bag.includes("🗝️")){
      open(`<h2>Locked!</h2><p>A silver key should fit. Have you looked in the cold place? ❄️</p>
        <div class="row"><button class="btn" data-close>OK</button></div>`); return;
    }
    winRoom("🗝️ Clunk! The kitchen door opens.","You used the silver key!");
  };

  /* --- Room 3 --- */
  H.sign = ()=> open(`<h2>Garden sign</h2>
    <p>"Mix two paint pots to make <b>GREEN</b>.<br>Then pick the flower that matches."</p>
    <div class="row"><button class="btn" data-close>OK</button></div>`);

  H.paints = ()=>{
    if(S.mixed){ open(`<h2>Paint pots</h2><p>Your green paint is ready. 🟢</p>
      <div class="row"><button class="btn" data-close>OK</button></div>`); return; }
    S.picked=[];
    open(`<h2>Pick two pots to mix</h2>
      <div class="row">
        <button class="big" data-pot="blue" style="background:#4a8fe0">🔵</button>
        <button class="big" data-pot="yellow" style="background:#ffd93d">🟡</button>
        <button class="big" data-pot="red" style="background:#e05a5a">🔴</button>
      </div>
      <p id="mixmsg" style="font-size:20px;min-height:28px">Which two make green?</p>
      <div class="row"><button class="btn alt" data-close>Later</button></div>`);
  };

  function potTap(e){
    const p=e.currentTarget.dataset.pot;
    if(S.picked.includes(p)) return;
    S.picked.push(p); e.currentTarget.classList.add("picked");
    if(S.picked.length<2){ $("mixmsg").textContent="…and one more!"; return; }
    const ok = S.picked.includes("blue") && S.picked.includes("yellow");
    if(ok){
      S.mixed=true; confetti();
      setTimeout(()=>{
        give("🟢","Blue + yellow = GREEN! Now find the green flower.");
        open(`<h2>Swirl swirl… GREEN! 🎉</h2><div style="font-size:56px">🟢</div>
          <p>Now pick the flower that matches your green paint.</p>
          <div class="row"><button class="btn" data-close>Go!</button></div>`);
        render();
      },400);
    } else {
      wrong(); $("mixmsg").textContent="That makes another color. Try again!";
      S.picked=[]; card.querySelectorAll(".big").forEach(b=>b.classList.remove("picked"));
    }
  }

  H.flowers = ()=>{
    if(!S.mixed){
      open(`<h2>Pretty flowers</h2><p>Which one? You need a color clue first. 🎨</p>
        <div class="row"><button class="btn" data-close>OK</button></div>`); return;
    }
    if(S.bag.includes("⭐")){
      open(`<h2>Flowers</h2><p>They wave at you in the breeze. 🌬️</p>
        <div class="row"><button class="btn" data-close>OK</button></div>`); return;
    }
    open(`<h2>Pick the GREEN one</h2>
      <div class="row">
        <button class="big" data-fl="0">🌷</button>
        <button class="big" data-fl="1">🍀</button>
        <button class="big" data-fl="2">🌻</button>
      </div>
      <div class="row"><button class="btn alt" data-close>Later</button></div>`);
  };

  function flowerTap(e){
    if(e.currentTarget.dataset.fl==="1"){
      confetti();
      setTimeout(()=>{
        give("⭐","A star key was hiding under the green clover!");
        open(`<h2>Sparkle! 🎉</h2><div style="font-size:56px">⭐</div>
          <p>The last star key! Open the big gate!</p>
          <div class="row"><button class="btn" data-close>Yes!</button></div>`);
      },400);
    } else { wrong(); }
  }

  H.door3 = ()=>{
    if(!S.bag.includes("⭐")){
      open(`<h2>The big gate</h2><p>Three star holes… and one is still empty. 🌟</p>
        <div class="row"><button class="btn" data-close>OK</button></div>`); return;
    }
    addKey(); confetti();
    open(`<h2>🎉 YOU ESCAPED! 🎉</h2>
      <div style="font-size:56px">⭐⭐⭐</div>
      <p>You solved all three rooms. You are a real escape hero!</p>
      <div class="row"><button class="btn" data-again>Play again</button></div>`);
    say("You escaped! Amazing work. 🦊");
  };

  /* ---------- room transitions ---------- */
  function winRoom(title,msg){
    addKey(); confetti();
    open(`<h2>${title}</h2><p>${msg}</p>
      <div class="row"><button class="btn" data-next>Next room →</button></div>`);
  }

  function nextRoom(){
    S.room++; S.bag=[]; drawBag(); close(); render();
    say(S.room===1 ? "A kitchen! Something smells sweet. 🍪"
                   : "Outside at last — but the big gate is locked. 🌳");
  }

  function reset(){
    S.room=0; S.keys=0; S.bag=[]; S.blockOrder=[]; S.drawerOpen=false;
    S.mixed=false; S.picked=[];
    [0,1,2].forEach(i=>$("k"+i).classList.remove("on"));
    drawBag(); close(); render(); say("Tap things in the room to look at them!");
  }

  /* ---------- delegated modal clicks ---------- */
  card.addEventListener("click", e=>{
    const b = e.target.closest("button"); if(!b) return;
    if(b.hasAttribute("data-close")) return close();
    if(b.hasAttribute("data-next"))  return nextRoom();
    if(b.hasAttribute("data-again")) return reset();
    if(b.dataset.blk) return blockTap({currentTarget:b});
    if(b.dataset.num) return numTap({currentTarget:b});
    if(b.dataset.pot) return potTap({currentTarget:b});
    if(b.dataset.fl)  return flowerTap({currentTarget:b});
  });
  scrim.addEventListener("click", e=>{ if(e.target===scrim) close(); });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !scrim.hidden) close(); });

  drawBag(); render();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Key Escape — a room escape game for kids</title>
<meta name="description" content="A friendly ten-room escape game for kids. Find the clues, solve the puzzles, collect all ten star keys.">
<style>
  *,*::before,*::after{box-sizing:border-box}
  [hidden]{display:none !important}
  :root{
    --bg:#1a1033; --bg2:#2a1b52; --panel:#fffdf7; --ink:#2b2340;
    --gold:#ffc93c; --pink:#ff7eb6; --mint:#3ddc97; --sky:#5ec8ff;
    --shadow:0 8px 0 rgba(0,0,0,.18);
  }
  html,body{height:100%}
  body{
    margin:0; font-family:"Baloo 2",Verdana,"Trebuchet MS",system-ui,sans-serif;
    background:radial-gradient(120% 90% at 50% 0%,var(--bg2),var(--bg));
    color:var(--ink); min-height:100%; padding:12px;
    display:flex; flex-direction:column; align-items:center; gap:12px;
  }
  h1,h2,h3{margin:0}
  button{font:inherit; cursor:pointer; border:none; background:none; color:inherit}

  .wrap{width:100%; max-width:900px; display:flex; flex-direction:column; gap:12px}

  header.hud{
    display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    background:var(--panel); border-radius:18px; padding:10px 14px; box-shadow:var(--shadow);
  }
  .title{font-size:20px; font-weight:800; letter-spacing:.5px}
  .title .star{color:#e8a300}
  .roomname{font-size:15px; background:#efe9ff; border-radius:999px; padding:4px 12px; font-weight:700}
  .prog{margin-left:auto; display:flex; align-items:center; gap:8px; min-width:150px}
  .bar{flex:1; height:14px; background:#efe9ff; border-radius:999px; overflow:hidden; min-width:70px}
  .bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--gold),#ff9f5a);
    border-radius:999px; transition:width .5s}
  .count{font-weight:800; font-size:15px; white-space:nowrap}

  .stage{position:relative; width:100%; aspect-ratio:4/3; max-height:62vh;
    border-radius:22px; overflow:hidden; box-shadow:var(--shadow); background:#000}
  .stage svg{position:absolute; inset:0; width:100%; height:100%; display:block}
  .hot{cursor:pointer}
  .hot:hover{filter:brightness(1.12) drop-shadow(0 0 8px rgba(255,255,255,.85))}
  .hot:focus-visible{outline:3px solid #fff; outline-offset:2px}

  .say{background:var(--panel); border-radius:18px; padding:12px 16px; box-shadow:var(--shadow);
    font-size:17px; font-weight:700; min-height:56px; display:flex; align-items:center; gap:10px}
  .say .face{font-size:24px}

  .bag{display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    background:rgba(255,255,255,.12); border-radius:18px; padding:8px 12px; color:#fff}
  .bag .label{font-weight:800; font-size:14px; letter-spacing:1px; opacity:.85}
  .item{font-size:24px; background:var(--panel); border-radius:12px; padding:4px 8px; box-shadow:0 3px 0 rgba(0,0,0,.25)}

  .scrim{position:fixed; inset:0; background:rgba(12,6,30,.72); display:flex;
    align-items:center; justify-content:center; padding:16px; z-index:20; overflow:auto}
  .card{background:var(--panel); border-radius:24px; padding:20px; width:min(470px,100%);
    box-shadow:0 12px 0 rgba(0,0,0,.3); text-align:center; margin:auto}
  .card h2{font-size:22px; margin-bottom:6px}
  .card p{font-size:16px; margin:8px 0 14px}
  .btn{background:var(--mint); color:#0d3a29; font-weight:800; border-radius:999px;
    padding:10px 22px; box-shadow:0 4px 0 #23a874; font-size:17px}
  .btn:active{transform:translateY(3px); box-shadow:0 1px 0 #23a874}
  .btn.alt{background:var(--sky); box-shadow:0 4px 0 #2a92c9; color:#06364f}
  .btn.ghost{background:#efe9ff; box-shadow:0 4px 0 #cdc2f0; color:#3a2f5e}

  .pad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:10px auto; max-width:260px}
  .pad button{background:#efe9ff; border-radius:14px; padding:12px 0; font-size:22px; font-weight:800;
    box-shadow:0 4px 0 #cdc2f0}
  .pad button:active{transform:translateY(3px); box-shadow:0 1px 0 #cdc2f0}
  .screen{font-size:34px; letter-spacing:10px; font-weight:800; background:#2b2340; color:var(--gold);
    border-radius:14px; padding:8px; min-height:52px}
  .row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:10px 0}
  .big{font-size:40px; background:#efe9ff; border-radius:18px; padding:10px 14px; box-shadow:0 5px 0 #cdc2f0;
    line-height:1.1; min-width:70px}
  .big:active{transform:translateY(3px); box-shadow:0 2px 0 #cdc2f0}
  .big.picked{outline:4px solid var(--pink)}
  .big.lit{outline:5px solid var(--gold); transform:scale(1.12); filter:brightness(1.3)}
  .clue{font-size:34px; letter-spacing:6px}
  .msg{font-size:19px; min-height:30px; font-weight:700}
  .shake{animation:sh .4s}
  @keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .pop{animation:pp .5s}
  @keyframes pp{50%{transform:scale(1.18)}}

  .map{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:12px 0}
  .map b{background:#efe9ff; border-radius:12px; padding:8px 0; font-size:19px; font-weight:800}
  .map b.done{background:var(--gold)}
  .map b.now{outline:3px solid var(--pink)}

  .conf{position:fixed; inset:0; pointer-events:none; z-index:30; overflow:hidden}
  .conf i{position:absolute; top:-24px; font-size:22px; animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

  /* advanced-room puzzle bits */
  .grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; max-width:250px; margin:10px auto}
  .grid4 div{aspect-ratio:1; background:#efe9ff; border-radius:10px; display:flex; align-items:center;
    justify-content:center; font-size:26px}
  .grid4 div.wall{background:#6b5a48}
  .grid4 button{aspect-ratio:1; background:#fff; border-radius:10px; border:3px dashed #cdc2f0; font-size:26px}
  .grid4 div.on,.grid4 button.on{background:#3ddc97; border-style:solid}
  .queue{font-size:22px; letter-spacing:3px; background:#efe9ff; border-radius:12px; padding:8px; min-height:42px}
  .dpad{display:grid; grid-template-columns:repeat(3,58px); grid-template-rows:repeat(2,58px);
    gap:6px; justify-content:center; margin:10px auto}
  .dpad button{background:#efe9ff; border-radius:14px; font-size:26px; box-shadow:0 4px 0 #cdc2f0}
  .dpad button:active{transform:translateY(3px); box-shadow:0 1px 0 #cdc2f0}
  .lamps{display:flex; gap:8px; justify-content:center; margin:12px 0}
  .lamps button{font-size:38px; border-radius:14px; padding:6px 10px; background:#2b2340; box-shadow:0 4px 0 #14102a}
  .lamps button.on{background:#ffd93d; box-shadow:0 4px 0 #c9a520}
  .mini{font-size:15px; opacity:.8; margin-top:4px}

  /* master-tier puzzle bits */
  .gridp{display:grid; gap:6px; justify-content:center; margin:12px auto}
  .gridp.g4{grid-template-columns:repeat(4,58px)}
  .gridp.g3{grid-template-columns:repeat(3,58px)}
  .gridp button,.gridp div{width:58px; height:58px; border-radius:10px; background:#fff;
    border:2px solid #cdc2f0; font-size:24px; font-weight:800; color:#3a2f5e;
    display:flex; align-items:center; justify-content:center; padding:0}
  .gridp div.fixed{background:#cdc2f0; border-color:#b3a4e6}
  .gridp button.seen{background:#ffe0e0; border-color:#ff9c9c}
  .gridp button.can{background:#d7f7e9; border-color:#3ddc97}
  .gridp div.gap{background:transparent; border:2px dashed #cdc2f0}
  .pipewrap{display:flex; align-items:center; justify-content:center; gap:4px}
  .pipewrap span{font-size:24px}
  .pegs{display:flex; gap:10px; justify-content:center; margin:12px 0}
  .pegs .peg{position:relative; width:86px; height:112px; background:#efe9ff; border-radius:12px;
    display:flex; flex-direction:column; justify-content:flex-end; align-items:center; padding-bottom:6px}
  .pegs .peg.sel{outline:4px solid var(--pink)}
  .pegs .rod{position:absolute; top:10px; width:8px; height:86px; background:#c9a24a; border-radius:4px}
  .pegs .rings{position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:3px}
  .pegs i{display:block; height:14px; border-radius:7px}
  #heldbox{min-height:20px; display:flex; justify-content:center}
  #heldbox i{display:block; height:14px; border-radius:7px}
  .banks{display:flex; align-items:center; justify-content:center; gap:8px; margin:10px 0}
  .banks .bank{flex:1; background:#efe9ff; border-radius:14px; padding:8px 4px; min-width:0}
  .banks .bank b{font-size:13px; opacity:.7; display:block}
  .banks .stuff{font-size:26px; min-height:36px}
  .banks .you{font-size:20px}
  .banks .you.dim{opacity:.25}
  .banks .water{font-size:20px; opacity:.6}

  /* grandmaster puzzle bits */
  .mmrow{display:flex; gap:5px; align-items:center; justify-content:center; margin:4px 0}
  .mmrow i{width:26px; height:26px; border-radius:50%; display:block}
  .pegs2{font-size:14px; letter-spacing:1px; margin-left:6px}
  .slot2{width:34px; height:34px; border-radius:50%; background:#efe9ff; border:3px solid #cdc2f0; display:inline-block}
  .gridp div.target{background:#fff2cc; border-color:#e8c07a}
  .gridp button.head{outline:3px solid var(--pink)}
  .gridp button.start{background:#d7f7e9}
  .gridp button.endcell{background:#ffe0e0}
  .gridp button.on{background:#cdefff; border-color:#5ec8ff}
  .nono{--nc:42px; display:inline-grid; grid-template-columns:44px repeat(5,var(--nc)); gap:4px; margin:8px auto}
  .nono .nc{font-size:13px; font-weight:800; color:#5a4f86; display:flex; align-items:center; justify-content:center}
  .nono .nc.side{justify-content:flex-end; padding-right:4px}
  .nono .nc.top{align-items:flex-end; min-height:34px}
  .nono .ncell{width:var(--nc); height:var(--nc); border-radius:8px; background:#fff; border:2px solid #cdc2f0}
  .nono .ncell.on{background:#3a2f5e; border-color:#3a2f5e}
  .bigtime{font-size:26px; font-weight:800; background:#2b2340; color:var(--gold);
    border-radius:14px; padding:8px; margin:10px auto; max-width:200px}
  .jugs{display:flex; gap:22px; justify-content:center; align-items:flex-end; margin:10px 0}
  .jug{display:flex; flex-direction:column; align-items:center; gap:2px; font-size:14px}
  .qlist{display:flex; flex-direction:column; gap:8px; margin:10px 0}
  .qbtn{background:#efe9ff; border-radius:14px; padding:10px 12px; font-size:15px; text-align:left;
    box-shadow:0 3px 0 #cdc2f0; line-height:1.35}
  .coins{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; max-width:280px; margin:10px auto}
  .coin{background:#efe9ff; border-radius:12px; padding:6px 0; font-size:24px; box-shadow:0 3px 0 #cdc2f0;
    display:flex; flex-direction:column; align-items:center; line-height:1}
  .coin small{font-size:12px; font-weight:800}
  .coin.p1{background:#cdefff; box-shadow:0 3px 0 #7cc4e8}
  .coin.p2{background:#ffe6c7; box-shadow:0 3px 0 #e8b878}

  /* legend-tier puzzle bits */
  .gridp.g5{grid-template-columns:repeat(5,46px)}
  .gridp.g5 button,.gridp.g5 div{width:46px; height:46px; font-size:18px}
  .gridp button.carcell{border-radius:8px}
  .zebra{display:inline-grid; grid-template-columns:64px repeat(3,54px); gap:5px; margin:10px auto}
  .zebra .zl{font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:flex-end; padding-right:4px}
  .zebra .zh{font-size:14px; font-weight:800; display:flex; align-items:center; justify-content:center}
  .zebra button{height:50px; border-radius:10px; background:#fff; border:2px solid #cdc2f0; font-size:24px}
  .sum{font-family:ui-monospace,Menlo,monospace; margin:10px auto; display:inline-block; text-align:right}
  .sum div{display:flex; gap:4px; justify-content:flex-end; align-items:center}
  .sum i{width:32px; height:38px; border-radius:6px; background:#efe9ff; font-style:normal;
    font-size:22px; font-weight:800; display:flex; align-items:center; justify-content:center}
  .sum b{font-size:20px; margin-right:4px}
  .sum hr{border:none; border-top:3px solid #3a2f5e; margin:5px 0}
  .tubes{display:flex; gap:10px; justify-content:center; margin:12px 0}
  .tube{background:#e8f4fb; border:3px solid #9fc4d6; border-radius:8px 8px 18px 18px; padding:5px 4px;
    display:flex; flex-direction:column; gap:4px}
  .tube i{width:26px; height:26px; border-radius:50%; display:block; background:#cfe0ea}
  .tube i.empty{background:transparent; border:2px dashed #cfe0ea}
  .tube.picked{outline:4px solid var(--pink)}
  .sticks{display:flex; flex-wrap:wrap; gap:5px; justify-content:center; margin:10px auto; max-width:250px}
  .sticks i{display:block; width:7px; height:34px; border-radius:3px;
    background:linear-gradient(#c44 0 7px,#e8d5a8 7px 100%)}
  .tri{display:flex; flex-direction:column; align-items:center; gap:6px; margin:12px 0}
  .trirow{display:flex; gap:6px}
  .hole{width:34px; height:34px; border-radius:50%; background:#e8e0d0; border:2px solid #c9b48a}
  .hole.peg{background:#e8a33c; border-color:#b5762f}
  .hole.picked{outline:3px solid var(--pink)}
  .hole.can{border-color:#3ddc97; border-width:3px}
  .gridp button small.cage{position:absolute; top:2px; left:4px; font-size:10px; font-weight:800; opacity:.75}
  .gridp button{position:relative}
  .sky{display:inline-grid; grid-template-columns:repeat(6,40px); gap:4px; margin:10px auto}
  .sky .sc{font-size:14px; font-weight:800; color:#5a4f86; display:flex; align-items:center; justify-content:center}
  .sky button{width:40px; height:40px; border-radius:8px; background:#fff; border:2px solid #cdc2f0;
    font-size:19px; font-weight:800; color:#3a2f5e}

  /* mythic-tier puzzle bits */
  .gridp.g6{grid-template-columns:repeat(6,40px)}
  .gridp.g6 button,.gridp.g6 div{width:40px; height:40px; font-size:18px}
  .gridp button.shaded{background:#3a2f5e; color:#fff; border-color:#3a2f5e}
  .futo{display:inline-grid; grid-template-columns:repeat(9,auto); gap:2px; margin:10px auto; align-items:center}
  .fcell{width:40px; height:40px; border-radius:8px; background:#fff; border:2px solid #cdc2f0;
    font-size:19px; font-weight:800; color:#3a2f5e; display:flex; align-items:center; justify-content:center}
  .fcell.fixed{background:#cdc2f0}
  .fcell.picked{outline:3px solid var(--pink)}
  .fsign{width:16px; height:16px; font-size:13px; color:#8a5ac6; font-weight:800;
    display:flex; align-items:center; justify-content:center}
  .fsign.v{width:40px; height:14px}
  .tentgrid{display:inline-grid; grid-template-columns:repeat(6,42px); gap:4px; margin:10px auto}
  .tentgrid .sc{font-size:14px; font-weight:800; color:#2f6b23; display:flex; align-items:center; justify-content:center}
  .tcell{width:42px; height:42px; border-radius:8px; background:#eaf6e6; border:2px solid #9ecb96;
    font-size:20px; display:flex; align-items:center; justify-content:center}
  .tcell.tent{background:#ffe9a8; border-color:#e8c07a}
  .brsvg{width:230px; height:230px; display:block; margin:6px auto}
  .brtaps{display:grid; grid-template-columns:repeat(4,1fr); gap:5px; max-width:280px; margin:6px auto}
  .brbtn{background:#efe9ff; border-radius:10px; padding:5px 0; font-weight:800; font-size:14px;
    box-shadow:0 3px 0 #cdc2f0; display:flex; flex-direction:column; line-height:1.1}
  .brbtn small{font-size:11px; opacity:.7}
  .brbtn.ok{background:#d7f7e9; box-shadow:0 3px 0 #3ddc97}
  .brbtn.picked{outline:3px solid var(--pink)}
  .chess{display:inline-grid; grid-template-columns:repeat(8,32px); gap:0; margin:10px auto;
    border:3px solid #8a7358; border-radius:4px; overflow:hidden}
  .chess .sq{width:32px; height:32px; background:#e8dcc0; font-size:21px; line-height:1;
    display:flex; align-items:center; justify-content:center; border-radius:0}
  .chess .sq.dark{background:#a8906a}
  .chess .sq.picked{outline:3px solid var(--pink); outline-offset:-3px}
  .einstein{display:inline-grid; grid-template-columns:56px repeat(5,46px); gap:4px; margin:10px auto}
  .einstein .zl{font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:flex-end; padding-right:3px}
  .einstein .zh{font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:center}
  .einstein button{height:44px; border-radius:9px; background:#fff; border:2px solid #cdc2f0; font-size:21px}
  .coins.c12{grid-template-columns:repeat(6,1fr); max-width:300px}

  /* ascendant-tier puzzle bits */
  .gridp.g9{grid-template-columns:repeat(9,26px); gap:3px}
  .gridp.g9 button,.gridp.g9 div{width:26px; height:26px; font-size:14px; border-width:1px}
  .gridp div.akwall{background:#4a4a3a; color:#ffe; border-color:#4a4a3a}
  .gridp button.lit{background:#fffbe0}
  .gridp button.bulb{background:#ffe066; border-color:#e8c020}
  .gridp button.paired{background:#d7f7e9; border-color:#3ddc97}
  .big.kd{font-size:22px; min-width:48px; padding:6px 10px}
  .kak{display:inline-grid; grid-template-columns:repeat(4,52px); gap:4px; margin:10px auto}
  .kclue{background:#3a4a3a; color:#e8f4e8; border-radius:6px; font-size:15px; font-weight:800;
    display:flex; align-items:center; justify-content:center; height:52px}
  .kclue.corner{background:#2b3a2b}
  .kcell{width:52px; height:52px; border-radius:8px; background:#fff; border:2px solid #9fc89f;
    font-size:22px; font-weight:800; color:#2b3a2b}
  .kcell.picked{outline:3px solid var(--pink)}
  .bsgrid{display:inline-grid; grid-template-columns:repeat(6,42px); gap:4px; margin:10px auto}
  .bsgrid .sc{font-size:14px; font-weight:800; color:#2c6689; display:flex; align-items:center; justify-content:center}
  .bscell{width:42px; height:42px; border-radius:8px; background:#e8f4fa; border:2px solid #7fb8d8; font-size:19px}
  .bscell.ship{background:#2c6689}
  .cryptline{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:10px 0}
  .cword{display:flex; gap:3px}
  .cslot{display:flex; flex-direction:column; align-items:center; background:#efe9ff; border-radius:6px;
    padding:3px 4px; min-width:24px}
  .cslot b{font-size:18px; color:#3a2f5e}
  .cslot small{font-size:10px; opacity:.6}
  .abcpad{display:grid; grid-template-columns:repeat(9,1fr); gap:3px; margin:8px auto; max-width:300px}
  .abcpad button{background:#efe9ff; border-radius:6px; padding:5px 0; font-size:13px; font-weight:800;
    box-shadow:0 2px 0 #cdc2f0}
  .guess{font-family:ui-monospace,Menlo,monospace; font-size:20px; letter-spacing:3px}

  @media (max-width:520px){
    .title{font-size:17px} .say{font-size:15px} .stage{max-height:48vh} .big{font-size:32px; min-width:60px}
    .nono{--nc:32px; grid-template-columns:34px repeat(5,var(--nc)); gap:3px}
    .nono .nc{font-size:11px}
    .gridp.g4{grid-template-columns:repeat(4,50px)}
    .gridp.g3{grid-template-columns:repeat(3,50px)}
    .gridp button,.gridp div{width:50px; height:50px; font-size:21px}
    .gridp.g5{grid-template-columns:repeat(5,40px)}
    .gridp.g5 button,.gridp.g5 div{width:40px; height:40px; font-size:16px}
    .zebra{grid-template-columns:54px repeat(3,46px)}
    .zebra button{height:44px; font-size:20px}
    .sky{grid-template-columns:repeat(6,34px)}
    .sky button{width:34px; height:34px; font-size:17px}
    .tubes{gap:7px} .tube i{width:22px; height:22px}
    .gridp.g6{grid-template-columns:repeat(6,34px)}
    .gridp.g6 button,.gridp.g6 div{width:34px; height:34px; font-size:15px}
    .fcell{width:34px; height:34px; font-size:16px}
    .fsign.v{width:34px}
    .tentgrid{grid-template-columns:repeat(6,36px)}
    .tcell{width:36px; height:36px; font-size:17px}
    .chess{grid-template-columns:repeat(8,27px)}
    .chess .sq{width:27px; height:27px; font-size:18px}
    .einstein{grid-template-columns:48px repeat(5,38px)}
    .einstein button{height:38px; font-size:18px}
    .brsvg{width:200px; height:200px}
    .coins.c12{max-width:250px}
    .gridp.g9{grid-template-columns:repeat(9,24px); gap:2px}
    .gridp.g9 button,.gridp.g9 div{width:24px; height:24px; font-size:13px}
    .kak{grid-template-columns:repeat(4,46px)}
    .kcell,.kclue{width:46px; height:46px; font-size:19px}
    .bsgrid{grid-template-columns:repeat(6,36px)}
    .bscell{width:36px; height:36px; font-size:16px}
    .abcpad{grid-template-columns:repeat(7,1fr)}
    .coins{max-width:240px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hud">
    <div class="title"><span class="star">★</span> Star Key Escape</div>
    <div class="roomname" id="roomname">Toy Room</div>
    <div class="prog" aria-label="star keys collected">
      <span class="count" id="count">⭐ 0/10</span>
      <span class="bar"><i id="fill"></i></span>
    </div>
  </header>

  <div class="stage" id="stage"></div>

  <div class="say"><span class="face">🦊</span><span id="say">Tap things in the room to look at them!</span></div>

  <div class="bag"><span class="label">BAG</span><span id="bag"></span></div>
</div>

<div class="conf" id="conf" hidden></div>
<div class="scrim" id="scrim" hidden><div class="card" id="card"></div></div>

<script>
(function(){
  "use strict";
  const $ = id => document.getElementById(id);
  const stage=$("stage"), scrim=$("scrim"), card=$("card");
  const SAVE="starKeyEscape.furthest";

  /* ---------- state (memory is the source of truth; storage is write-through) ---------- */
  const S = {
    room:0, keys:0, bag:[], furthest:0,
    solved:{},          // room index -> true
    want:[], got:[],    // "tap in order" puzzles
    code:null,          // keypad answer
    picked:[],          // multi-pick puzzles
    onDone:null,
    seq:[], busy:false
  };

  function loadSave(){
    try{
      const v = localStorage.getItem(SAVE);
      if(v!==null){ const n=parseInt(v,10); if(!isNaN(n)) S.furthest=Math.min(Math.max(n,0),ROOMS.length-1); }
    }catch(e){/* storage unavailable: play without resume */}
  }
  function save(){
    try{ localStorage.setItem(SAVE,String(S.furthest)); }catch(e){}
  }

  /* ---------- small helpers ---------- */
  function say(t){ $("say").textContent = t; }
  function give(item){ if(item && !S.bag.includes(item)) S.bag.push(item); drawBag(); }
  function drawBag(){
    $("bag").innerHTML = S.bag.length
      ? S.bag.map(e=>'<span class="item">'+e+'</span>').join("")
      : '<span style="opacity:.7;font-size:14px">empty</span>';
  }
  function drawProgress(){
    $("count").textContent = "⭐ "+S.keys+"/"+ROOMS.length;
    $("fill").style.width = (S.keys/ROOMS.length*100)+"%";
  }
  function close(){ scrim.hidden = true; card.innerHTML=""; }
  function open(html){ card.innerHTML = html; scrim.hidden = false; }
  function wrong(){ card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake"); }
  function msg(t){ const m=card.querySelector(".msg"); if(m) m.textContent=t; }
  function confetti(){
    const c=$("conf"); c.hidden=false; c.innerHTML="";
    const bits=["🎉","⭐","🎈","✨","🌟","🎊"];
    for(let i=0;i<40;i++){
      const s=document.createElement("i");
      s.textContent=bits[i%bits.length];
      s.style.left=Math.random()*100+"%";
      s.style.animationDuration=(2+Math.random()*2.5)+"s";
      s.style.animationDelay=(Math.random()*1.2)+"s";
      c.appendChild(s);
    }
    setTimeout(()=>{c.hidden=true; c.innerHTML="";},6000);
  }

  /* ---------- generic puzzle plumbing ---------- */
  function order(want, done){ S.want=want; S.got=[]; S.onDone=done; }
  function ordTap(b){
    const v=b.dataset.ord, i=S.got.length;
    if(v!==S.want[i]){
      S.got=[]; wrong(); msg("Oops — start from the beginning!");
      card.querySelectorAll("[data-ord]").forEach(x=>x.classList.remove("picked"));
      return;
    }
    S.got.push(v); b.classList.add("picked","pop");
    msg(S.got.length===S.want.length ? "Yes!" : (S.showGot ? S.got.join("") : "Keep going…"));
    if(S.got.length===S.want.length) setTimeout(S.onDone,350);
  }
  function pickTap(b){
    if(b.dataset.pick==="ok"){ b.classList.add("picked"); setTimeout(S.onDone,300); }
    else { wrong(); msg("Not that one — look again!"); }
  }
  function numTap(b){
    const scr=$("scr"), n=b.dataset.num;
    if(S.codeLen>1){                                  // vault: collect digits, then check
      S.entry=(S.entry||"")+n;
      scr.textContent=S.entry;
      if(S.entry.length<S.codeLen) return;
      if(+S.entry===S.code) return void setTimeout(S.onDone,300);
      wrong(); scr.textContent="✖"; S.entry="";
      setTimeout(()=>{ const e=$("scr"); if(e) e.textContent="_"; },800);
      return;
    }
    scr.textContent=n;
    if(+n===S.code){ setTimeout(S.onDone,300); }
    else { wrong(); scr.textContent="✖"; setTimeout(()=>{ const e=$("scr"); if(e) e.textContent="_"; },700); }
  }
  function keypad(zero){
    const keys=[1,2,3,4,5,6,7,8,9].concat(zero?[0]:[]);
    return '<div class="pad">'+keys.map(n=>'<button data-num="'+n+'">'+n+'</button>').join("")+
           (zero?'<button data-wipe>⌫</button>':'')+'</div>';
  }

  /* solved! give the souvenir, celebrate, point at the door */
  function solve(item, title, body){
    S.solved[S.room]=true; give(item); confetti();
    open('<h2>'+title+'</h2><div style="font-size:56px">'+item+'</div><p>'+body+'</p>'+
         '<div class="row"><button class="btn" data-close>Open the door!</button></div>');
    say("The door is unlocked now — tap it!");
    render();
  }

  /* ---------- shared SVG pieces ---------- */
  function door(o){
    const g=o.frame||"#8a5a2b", p=o.panel||"#a06b35", x=o.x||610, y=o.y||170,
          w=o.w||150, h=o.h||270, isOpen=S.solved[S.room];
    return `<g class="hot" data-go="door" tabindex="0" role="button" aria-label="door">
      <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="${g}"/>
      <rect x="${x+16}" y="${y+16}" width="${w-32}" height="${h-32}" rx="9" fill="${isOpen?'#1b1030':p}"/>
      ${isOpen ? `<text x="${x+w/2}" y="${y+h/2+14}" font-size="44" text-anchor="middle">✨</text>`
             : `<rect x="${x+w/2-35}" y="${y+60}" width="70" height="48" rx="8" fill="#241a10"/>
                <text x="${x+w/2}" y="${y+94}" font-size="30" text-anchor="middle" fill="#ffd85e">⭐</text>`}
      <circle cx="${x+18}" cy="${y+h/2+20}" r="9" fill="#ffd85e"/>
    </g>`;
  }
  function sign(o){
    return `<g class="hot" data-go="${o.go}" tabindex="0" role="button" aria-label="clue">
      <rect x="${o.x}" y="${o.y}" width="${o.w||220}" height="${o.h||130}" rx="10"
            fill="#fffbee" stroke="${o.edge||"#d0b98a"}" stroke-width="6"/>
      ${o.inner||""}</g>`;
  }
  function svg(inner){ return '<svg viewBox="0 0 800 600" role="img" aria-label="room">'+inner+'</svg>'; }
  function stars(n,seed){
    let s="";
    for(let i=0;i<n;i++){
      const x=((i*137+seed*31)%780)+10, y=((i*89+seed*17)%330)+20, r=(i%3)?2:3.5;
      s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" opacity="${.5+(i%4)/8}"/>`;
    }
    return s;
  }

  /* =========================================================
     ROOMS
     ========================================================= */
  const ROOMS = [

  /* ---------- 1 · Toy Room : tap blocks in the poster's order ---------- */
  {
    name:"Toy Room",
    intro:"Tap things in the room to look at them!",
    locked:"This door needs a key. Look around the room. 🔎",
    draw(){ return svg(`
      <defs><linearGradient id="w1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffe3a8"/><stop offset="1" stop-color="#ffc27a"/></linearGradient></defs>
      <rect width="800" height="600" fill="url(#w1)"/>
      <rect y="440" width="800" height="160" fill="#c98b52"/><rect y="440" width="800" height="14" fill="#a86f3d"/>
      ${sign({go:"clue",x:70,y:90,w:200,h:140,inner:
        '<text x="170" y="150" font-size="26" text-anchor="middle">SECRET</text>'+
        '<text x="170" y="196" font-size="34" text-anchor="middle">🐻 🚀 🐟</text>'})}
      <rect x="330" y="250" width="230" height="16" rx="6" fill="#8a5a2b"/>
      <g class="hot" data-go="puzzle" tabindex="0" role="button" aria-label="toy blocks">
        <rect x="340" y="190" width="60" height="60" rx="10" fill="#ff7eb6"/><text x="370" y="234" font-size="30" text-anchor="middle">🚀</text>
        <rect x="415" y="190" width="60" height="60" rx="10" fill="#5ec8ff"/><text x="445" y="234" font-size="30" text-anchor="middle">🐟</text>
        <rect x="490" y="190" width="60" height="60" rx="10" fill="#3ddc97"/><text x="520" y="234" font-size="30" text-anchor="middle">🐻</text>
      </g>
      <g class="hot" data-go="extra" tabindex="0" role="button" aria-label="rug">
        <ellipse cx="160" cy="500" rx="120" ry="46" fill="#d95f7a"/><ellipse cx="160" cy="500" rx="80" ry="28" fill="#f08aa0"/>
      </g>
      ${door({})}
      <text x="400" y="60" font-size="28" text-anchor="middle" fill="#8a5a2b">Room 1 · Toy Room</text>`);
    },
    clue:()=>open(`<h2>A secret poster</h2><p>Someone drew three friends in a row.</p>
      <div class="clue">🐻 🚀 🐟</div><p>Maybe the toy blocks like this order too?</p>
      <div class="row"><button class="btn" data-close>OK!</button></div>`),
    extra:()=>{ say("Under the rug: just dust bunnies and a lost sock. 🧦"); close(); },
    puzzle(){
      order(["🐻","🚀","🐟"], ()=>solve("🔑","Click-clack! 🎉","The toy box popped open and a golden key was inside."));
      open(`<h2>Tap the blocks in the secret order</h2><p class="clue">🐻 🚀 🐟</p>
        <div class="row">
          <button class="big" data-ord="🚀">🚀</button>

        </div><p class="msg"></p>
        <div class="row"><button class="btn alt" data-close>Later</button></div>`);
    }

  {

      ${sign({go:"clue",x:90,y:90,w:230,h:140,inner:

        <rect x="410" y="160" width="130" height="100" rx="8" fill="#dceaf2"/>
        <rect x="524" y="200" width="10" height="40" rx="5" fill="#9bb4c2"/><rect x="524" y="290" width="10" height="60" rx="5" fill="#9bb4c2"/>
        <text x="455" y="215" font-size="30" text-anchor="middle">🧲</text>

      ${door({frame:"#4f7fa8",panel:"#6198c2"})}
      <text x="400" y="56" font-size="28" text-anchor="middle" fill="#31627f">Room 2 · Snack Kitchen</text>`);
    },
    clue:()=>open(`<h2>A note</h2><p>"Count the cookies on the table.<br>That number is the code."</p>

      open(`<h2>Magnet number lock</h2><div class="screen" id="scr">_</div>
        <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>'<button data-num="'+n+'">'+n+'</button>').join("")}</div>
        <div class="row"><button class="btn alt" data-close>Close</button></div>`);

  /* ---------- 3 · Sunny Garden : mix paint to make green ---------- */

      <circle cx="120" cy="110" r="52" fill="#ffe066"/><text x="120" y="126" font-size="46" text-anchor="middle">☀️</text>
      ${sign({go:"clue",x:380,y:120,w:240,h:120,edge:"#b98a5e",inner:
        '<text x="500" y="168" font-size="24" text-anchor="middle">Mix the pots</text>'+
        '<text x="500" y="206" font-size="24" text-anchor="middle">to make GREEN</text>'})}
      <g class="hot" data-go="puzzle" tabindex="0" role="button" aria-label="paint pots">
        <rect x="90" y="330" width="260" height="90" rx="12" fill="#b98a5e"/>
        <circle cx="150" cy="330" r="38" fill="#4a8fe0"/><circle cx="230" cy="330" r="38" fill="#ffd93d"/>
        <circle cx="310" cy="330" r="38" fill="#e05a5a"/>

      <text x="400" y="56" font-size="28" text-anchor="middle" fill="#2f6b23">Room 3 · Sunny Garden</text>`);
    },
    clue:()=>open(`<h2>Garden sign</h2><p>"Mix two paint pots to make <b>GREEN</b>."</p>
      <div class="row"><button class="btn" data-close>OK</button></div>`),
    extra:()=>{ say("Pretty flowers. One of them is hiding something green… 🍀"); close(); },
    puzzle(){
      S.picked=[];
      S.onDone=()=>solve("🍀","Swirl swirl… GREEN! 🎉","Under the green clover was the gate key.");
      open(`<h2>Pick two pots to mix</h2>

      <div class="row"><button class="btn" data-close>Got it</button></div>`),

      open(`<h2>Tap the planets: big → small</h2>

          <button class="big" data-ord="2">🦈<br><small>2</small></button>

  /* ---------- 6 · Dino Cave : 3 + 2 ---------- */
  {
    name:"Dino Cave",
    intro:"Careful — something big lives here. 🦕",
    locked:"A stone door with a number lock. The cave painting knows the answer.",
    draw(){ return svg(`
      <rect width="800" height="600" fill="#3b2a20"/>
      <path d="M0 0 L800 0 L800 120 Q600 170 400 120 T0 150Z" fill="#2a1d15"/>
      <rect y="450" width="800" height="150" fill="#5a4232"/>
      <g class="hot" data-go="clue" tabindex="0" role="button" aria-label="cave painting">

  /* ---------- lantern memory playback (rooms 9 and 13) ---------- */
  function playSeq(){
    if(S.busy) return;
    S.busy=true; S.got=[];
    card.querySelectorAll("[data-ord]").forEach(b=>b.classList.remove("picked"));
    msg("Watch carefully…");
    S.seq.forEach((c,i)=>{
      setTimeout(()=>{
        const b=card.querySelector('[data-lan="'+c+'"]'); if(!b) return;
        b.classList.add("lit");
        setTimeout(()=>b.classList.remove("lit"),480);
      }, 500+i*750);
    });
    setTimeout(()=>{ S.busy=false; if(card.querySelector(".msg")) msg("Now you try!"); }, 500+S.seq.length*750+200);
  }

  /* ---------- paint mixing (room 3) ---------- */
  function potTap(b){
    const p=b.dataset.pot;
    if(S.picked.includes(p)) return;
    S.picked.push(p); b.classList.add("picked");
    if(S.picked.length<2){ msg("…and one more!"); return; }
    if(S.picked.includes("blue") && S.picked.includes("yellow")) setTimeout(S.onDone,300);
    else{
      wrong(); msg("That makes another color. Try again!");
      S.picked=[]; card.querySelectorAll("[data-pot]").forEach(x=>x.classList.remove("picked"));
    }
  }

  /* ---------- clock hands (room 11) ---------- */
  function clockFace(h,m){
    const ha=((h%12)*30+m*0.5-90)*Math.PI/180, ma=(m*6-90)*Math.PI/180;
    const ticks=[...Array(12)].map((_,i)=>{
      const a=(i*30-90)*Math.PI/180;
      return `<text x="${100+74*Math.cos(a)}" y="${107+74*Math.sin(a)}" font-size="17"
                text-anchor="middle" fill="#2b2340">${i===0?12:i}</text>`;
    }).join("");
    return `<svg viewBox="0 0 200 200" width="190" height="190" aria-label="clock face">
      <circle cx="100" cy="100" r="94" fill="#fffbee" stroke="#c9a24a" stroke-width="8"/>${ticks}
      <line x1="100" y1="100" x2="${100+46*Math.cos(ha)}" y2="${100+46*Math.sin(ha)}"
            stroke="#2b2340" stroke-width="10" stroke-linecap="round"/>
      <line x1="100" y1="100" x2="${100+70*Math.cos(ma)}" y2="${100+70*Math.sin(ma)}"
            stroke="#d9558c" stroke-width="6" stroke-linecap="round"/>
      <circle cx="100" cy="100" r="8" fill="#2b2340"/></svg>`;
  }
  function drawClock(){
    const box=$("clockbox"); if(!box) return;
    box.innerHTML=clockFace(S.ch,S.cm);
    $("clocktime").textContent=S.ch+":"+String(S.cm).padStart(2,"0");
  }
  function clkTap(b){
    if(b.dataset.clk==="h") S.ch = S.ch%12 + 1;
    else S.cm = (S.cm + 5) % 60;
    drawClock();
    if(S.ch===3 && S.cm===30) setTimeout(S.onDone,350);
  }

  /* ---------- robot programming (room 14) ---------- */
  const ARROW={u:"⬆️",d:"⬇️",l:"⬅️",r:"➡️"};
  function drawRobot(){
    const g=$("rgrid"); if(!g) return;
    let h="";
    for(let r=0;r<4;r++) for(let c=0;c<4;c++){
      const wall=S.walls.some(w=>w[0]===c&&w[1]===r);
      const bot=S.rp[0]===c&&S.rp[1]===r, goal=(c===3&&r===0);
      h+='<div class="'+(wall?"wall":"")+'">'+(bot?"🤖":goal?"🚩":"")+'</div>';
    }
    g.innerHTML=h;
    $("rqueue").textContent = S.rq.length ? S.rq.map(d=>ARROW[d]).join(" ") : "(no moves yet)";
  }
  function resetRobot(){ S.rp=[0,3]; S.rq=[]; drawRobot(); }
  function cmdTap(b){
    const c=b.dataset.cmd;
    if(c==="clear") return resetRobot();
    if(c==="run")   return runRobot();
    if(S.rq.length>=10) return msg("That is a very long plan! Clear it and try a shorter one.");
    S.rq.push(c); drawRobot(); msg("");
  }
  function runRobot(){
    if(S.busy || !S.rq.length) return msg("Give the robot some moves first!");
    S.busy=true; S.rp=[0,3]; drawRobot();
    let i=0;
    const tick=()=>{
      if(i>=S.rq.length){
        S.busy=false;
        if(S.rp[0]===3 && S.rp[1]===0) return void setTimeout(S.onDone,300);
        msg("The robot stopped short of the flag. Try again!"); resetRobot(); return;
      }
      const d=S.rq[i++];
      const nc=S.rp[0]+(d==="r"?1:d==="l"?-1:0), nr=S.rp[1]+(d==="d"?1:d==="u"?-1:0);
      if(nc<0||nc>3||nr<0||nr>3||S.walls.some(w=>w[0]===nc&&w[1]===nr)){
        S.busy=false; wrong(); msg("Bonk! The robot hit a wall."); resetRobot(); return;
      }
      S.rp=[nc,nr]; drawRobot();
      setTimeout(tick,380);
    };
    msg("Running…"); setTimeout(tick,250);
  }

  /* ---------- mirror symmetry (room 15) ---------- */
  function drawMirror(){
    const g=$("mgrid"); if(!g) return;
    let h="";
    for(let r=0;r<4;r++){
      h+='<div class="'+(S.pat[r][0]?"on":"")+'"></div>';
      h+='<div class="'+(S.pat[r][1]?"on":"")+'"></div>';
      h+='<button class="'+(S.mg[r][0]?"on":"")+'" data-cell="'+r+'-0" aria-label="tile"></button>';
      h+='<button class="'+(S.mg[r][1]?"on":"")+'" data-cell="'+r+'-1" aria-label="tile"></button>';
    }
    g.innerHTML=h;
  }
  function cellTap(b){
    const [r,c]=b.dataset.cell.split("-").map(Number);
    S.mg[r][c]=S.mg[r][c]?0:1;
    drawMirror();
    // column 2 mirrors column 1, column 3 mirrors column 0
    const done=S.pat.every((row,r)=>S.mg[r][0]===row[1] && S.mg[r][1]===row[0]);
    if(done) setTimeout(S.onDone,300); else msg("Keep going…");
  }

  /* ---------- lamps (room 20) ---------- */
  function drawLamps(){
    const box=$("lampbox"); if(!box) return;
    box.innerHTML=S.lamps.map((v,i)=>
      '<button class="'+(v?"on":"")+'" data-lamp="'+i+'" aria-label="lamp '+(i+1)+'">'+(v?"💡":"🕯️")+'</button>'
    ).join("");
  }
  function lampTap(b){
    const i=+b.dataset.lamp;
    [i-1,i,i+1].forEach(j=>{ if(j>=0&&j<S.lamps.length) S.lamps[j]=S.lamps[j]?0:1; });
    drawLamps();
    if(S.lamps.every(v=>v)) setTimeout(S.onDone,350);
    else msg(S.lamps.filter(v=>v).length+" of 5 glowing");
  }

  /* ---------- 4x4 sudoku (room 21) ---------- */
  function sudokuOK(){
    const g=S.sud, ok=a=>{const t=a.slice().sort().join(""); return t==="1234";};
    for(let i=0;i<4;i++){ if(!ok(g[i]) || !ok([0,1,2,3].map(r=>g[r][i]))) return false; }
    for(let br=0;br<4;br+=2) for(let bc=0;bc<4;bc+=2)
      if(!ok([g[br][bc],g[br][bc+1],g[br+1][bc],g[br+1][bc+1]])) return false;
    return true;
  }
  function drawSudoku(){
    const g=$("sudgrid"); if(!g) return;
    let h="";
    for(let r=0;r<4;r++) for(let c=0;c<4;c++){
      const v=S.sud[r][c], fixed=S.fix[r][c]!==0;
      h += fixed ? '<div class="fixed">'+v+'</div>'
                 : '<button data-sud="'+r+'-'+c+'">'+(v||"")+'</button>';
    }
    g.innerHTML=h;
  }
  function sudTap(b){
    const [r,c]=b.dataset.sud.split("-").map(Number);
    S.sud[r][c]=(S.sud[r][c]+1)%5;
    drawSudoku();
    if(sudokuOK()) setTimeout(S.onDone,300);
    else msg(S.sud.flat().filter(v=>v).length+" of 16 filled");
  }

  /* ---------- river crossing (room 23) ---------- */
  const EATS=[["🦊","🐔"],["🐔","🌽"]];
  function riverSafe(bank){
    return !EATS.some(([a,b])=>bank.includes(a)&&bank.includes(b));
  }
  function drawRiver(){
    const box=$("riverbox"); if(!box) return;
    const here = S.boat==="L" ? S.left : S.right;
    box.innerHTML =
      '<div class="banks"><div class="bank">'+
        '<b>this side</b><div class="stuff">'+(S.left.join(" ")||"—")+'</div>'+
        (S.boat==="L"?'<div class="you">🧒🛶</div>':'<div class="you dim">·</div>')+
      '</div><div class="water">〰️〰️</div><div class="bank">'+
        '<b>far side</b><div class="stuff">'+(S.right.join(" ")||"—")+'</div>'+
        (S.boat==="R"?'<div class="you">🧒🛶</div>':'<div class="you dim">·</div>')+
      '</div></div>'+
      '<div class="row">'+
        here.map(it=>'<button class="big" data-river="'+it+'">'+it+'</button>').join("")+
        '<button class="big" data-river="alone">🧒</button>'+
      '</div>';
  }
  function riverTap(b){
    const it=b.dataset.river;
    const from = S.boat==="L" ? S.left : S.right;
    const to   = S.boat==="L" ? S.right : S.left;
    if(it!=="alone"){
      const i=from.indexOf(it); if(i<0) return;
      from.splice(i,1); to.push(it);
    }
    S.boat = S.boat==="L" ? "R" : "L";
    const leftBehind = S.boat==="L" ? S.right : S.left;   // the bank you just left
    drawRiver();
    if(!riverSafe(leftBehind)){
      wrong();
      msg(leftBehind.includes("🦊") && leftBehind.includes("🐔")
          ? "Oh no — the fox ate the chicken! Starting over."
          : "Oh no — the chicken ate the corn! Starting over.");
      S.resetTimer=setTimeout(()=>{ S.left=["🦊","🐔","🌽"]; S.right=[]; S.boat="L"; drawRiver(); },1200);
      return;
    }
    if(S.right.length===3 && S.boat==="R") return void setTimeout(S.onDone,400);
    msg(S.right.length+" of 3 across");
  }

  /* ---------- tower of hanoi (room 24) ---------- */
  const RINGW={1:34,2:50,3:66}, RINGC={1:"#3ddc97",2:"#e8a33c",3:"#c44"};
  function drawHanoi(){
    const box=$("pegbox"); if(!box) return;
    box.innerHTML=S.pegs.map((p,i)=>
      '<button class="peg'+(S.held&&S.held.peg===i?" sel":"")+'" data-peg="'+i+'">'+
        '<span class="rings">'+p.slice().reverse().map(d=>
          '<i style="width:'+RINGW[d]+'px;background:'+RINGC[d]+'"></i>').join("")+'</span>'+
        '<span class="rod"></span></button>').join("");
    const h=$("heldbox");
    if(h) h.innerHTML = S.held ? '<i style="width:'+RINGW[S.held.d]+'px;background:'+RINGC[S.held.d]+'"></i>' : "";
  }
  function pegTap(b){
    const i=+b.dataset.peg, peg=S.pegs[i];
    if(!S.held){
      if(!peg.length) return msg("That pillar is empty.");
      S.held={d:peg[peg.length-1], peg:i}; peg.pop(); drawHanoi();
      return msg("Holding a ring — tap a pillar to place it.");
    }
    const top=peg[peg.length-1];
    if(top && top < S.held.d){ wrong(); return msg("A big ring may not sit on a small one!"); }
    peg.push(S.held.d); S.held=null; S.moves++; drawHanoi();
    if(S.pegs[2].length===3) return void setTimeout(S.onDone,350);
    msg("Moves: "+S.moves);
  }

  /* ---------- pipes (room 26) ---------- */
  const POPEN={s:[["L","R"],["U","D"]], e:[["R","D"],["D","L"],["L","U"],["U","R"]]};
  const PDIR={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]}, POPP={U:"D",D:"U",L:"R",R:"L"};
  const pOpen=t => t.k==="s" ? POPEN.s[t.r%2] : POPEN.e[t.r%4];
  function pipeWet(){                       // cells the water actually reaches
    const wet=new Set(), seen=new Set(), q=[[0,0,"L"]];
    let out=false;
    while(q.length){
      const [c,r,from]=q.shift();
      if(c<0||c>2||r<0||r>2) continue;
      const key=c+","+r+","+from; if(seen.has(key)) continue; seen.add(key);
      const o=pOpen(S.pipes[r][c]);
      if(!o.includes(from)) continue;
      wet.add(c+","+r);
      for(const d of o){
        if(d===from) continue;
        if(c===2&&r===2&&d==="R"){ out=true; continue; }
        const [dx,dy]=PDIR[d];
        q.push([c+dx,r+dy,POPP[d]]);
      }
    }
    return {wet,out};
  }
  function pipeSVG(t,wet){
    const col=wet?"#4fa3d9":"#6b7a88", mid=29;
    const ends={U:[29,0],D:[29,58],L:[0,29],R:[58,29]};
    const lines=pOpen(t).map(d=>
      `<line x1="${mid}" y1="${mid}" x2="${ends[d][0]}" y2="${ends[d][1]}"
             stroke="${col}" stroke-width="12" stroke-linecap="round"/>`).join("");
    return `<svg viewBox="0 0 58 58" width="52" height="52">${lines}
      <circle cx="${mid}" cy="${mid}" r="7" fill="${col}"/></svg>`;
  }
  function drawPipes(){
    const g=$("pipegrid"); if(!g) return;
    const {wet}=pipeWet();
    let h="";
    for(let r=0;r<3;r++) for(let c=0;c<3;c++)
      h+='<button data-tile="'+r+'-'+c+'">'+pipeSVG(S.pipes[r][c],wet.has(c+","+r))+'</button>';
    g.innerHTML=h;
  }
  function tileTap(b){
    const [r,c]=b.dataset.tile.split("-").map(Number);
    S.pipes[r][c].r=(S.pipes[r][c].r+1)%4;
    drawPipes();
    const {out}=pipeWet();
    if(out) setTimeout(S.onDone,350); else msg("Keep turning…");
  }

  /* ---------- weights (room 27) ---------- */
  function drawWeights(){
    const row=$("wtrow"); if(!row) return;
    row.innerHTML=S.wv.map((w,i)=>
      '<button class="big'+(S.wts[i]?" picked":"")+'" data-wt="'+i+'">'+w+'</button>').join("");
    $("wtotal").textContent=S.wts.reduce((a,v,i)=>a+(v?S.wv[i]:0),0);
  }
  function wtTap(b){
    const i=+b.dataset.wt;
    S.wts[i]=S.wts[i]?0:1; drawWeights();
    const t=S.wts.reduce((a,v,j)=>a+(v?S.wv[j]:0),0);
    if(t===S.target) setTimeout(S.onDone,350);
    else msg(t>S.target ? "Too heavy!" : "Not heavy enough yet.");
  }

  /* ---------- four guards (room 28) ---------- */
  function seenBy(r,c){
    return S.guards.some(g=>g[0]!==r||g[1]!==c ?
      (g[0]===r||g[1]===c||Math.abs(g[0]-r)===Math.abs(g[1]-c)) : false);
  }
  function drawGuards(){
    const g=$("guardgrid"); if(!g) return;
    let h="";
    for(let r=0;r<4;r++) for(let c=0;c<4;c++){
      const has=S.guards.some(x=>x[0]===r&&x[1]===c);
      const hot=!has && seenBy(r,c);
      h+='<button class="'+(hot?"seen":"")+'" data-guard="'+r+'-'+c+'">'+(has?"🛡️":"")+'</button>';
    }
    g.innerHTML=h;
  }
  function guardTap(b){
    const [r,c]=b.dataset.guard.split("-").map(Number);
    const i=S.guards.findIndex(x=>x[0]===r&&x[1]===c);
    if(i>=0) S.guards.splice(i,1);
    else{
      if(S.guards.length>=4){ wrong(); return msg("That is already four guards — move one instead."); }
      if(seenBy(r,c)){ wrong(); drawGuards(); return msg("Another guard can see that square!"); }
      S.guards.push([r,c]);
    }
    drawGuards();
    if(S.guards.length===4) return void setTimeout(S.onDone,350);
    msg(S.guards.length+" of 4 posted");
  }

  /* ---------- magic square (room 29) ---------- */
  function magicOK(){
    const g=S.mag;
    if(g.flat().some(v=>v===null)) return false;
    const L=[[0,1,2].map(i=>g[0][i]),[0,1,2].map(i=>g[1][i]),[0,1,2].map(i=>g[2][i]),
             [0,1,2].map(i=>g[i][0]),[0,1,2].map(i=>g[i][1]),[0,1,2].map(i=>g[i][2]),
             [g[0][0],g[1][1],g[2][2]],[g[0][2],g[1][1],g[2][0]]];
    return L.every(l=>l.reduce((a,b)=>a+b,0)===15);
  }
  function drawMagic(){
    const g=$("maggrid"); if(!g) return;
    let h="";
    for(let r=0;r<3;r++) for(let c=0;c<3;c++){
      const v=S.mag[r][c], fixed=[[1,0,1],[0,0,1],[1,0,1]][r][c];
      h += (fixed ? '<div class="fixed">'+v+'</div>'
                  : '<button data-mcell="'+r+'-'+c+'">'+(v===null?"":v)+'</button>');
    }
    g.innerHTML=h;
    $("magtray").innerHTML = S.tray.length
      ? S.tray.map(n=>'<button class="big'+(S.sel===n?" picked":"")+'" data-tray="'+n+'">'+n+'</button>').join("")
      : '<span class="mini">tray empty</span>';
  }
  function trayTap(b){ S.sel=+b.dataset.tray; drawMagic(); msg("Now tap a hollow."); }
  function mcellTap(b){
    const [r,c]=b.dataset.mcell.split("-").map(Number);
    if(S.mag[r][c]!==null){                       // take it back
      S.tray.push(S.mag[r][c]); S.tray.sort((a,b)=>a-b); S.mag[r][c]=null;
      drawMagic(); return msg("Back in the tray.");
    }
    if(S.sel===null) return msg("Pick a number from the tray first.");
    S.mag[r][c]=S.sel;
    S.tray.splice(S.tray.indexOf(S.sel),1); S.sel=null;
    drawMagic();
    if(magicOK()) return void setTimeout(S.onDone,350);
    msg(S.tray.length ? S.tray.length+" left to place" : "All placed — but the lines don't make 15 yet.");
  }

  /* ---------- sliding puzzle (room 30) ---------- */
  function slideMoves(){
    const z=S.slide.indexOf(0), zr=Math.floor(z/3), zc=z%3, out=[];
    [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dr,dc])=>{
      const r=zr+dr, c=zc+dc;
      if(r>=0&&r<3&&c>=0&&c<3) out.push(r*3+c);
    });
    return out;
  }
  function scrambleSlide(n){
    for(let i=0;i<n;i++){
      const m=slideMoves();
      const pick=m[Math.floor(Math.random()*m.length)];
      const z=S.slide.indexOf(0);
      S.slide[z]=S.slide[pick]; S.slide[pick]=0;
    }
    if(S.slide.every((v,i)=>v===(i===8?0:i+1))) scrambleSlide(10);   // never start solved
  }
  function drawSlide(){
    const g=$("slidegrid"); if(!g) return;
    const movable=slideMoves();
    g.innerHTML=S.slide.map((v,i)=> v===0
      ? '<div class="gap"></div>'
      : '<button class="'+(movable.includes(i)?"can":"")+'" data-slide="'+i+'">'+v+'</button>').join("");
  }
  function slideTap(b){
    const i=+b.dataset.slide;
    if(!slideMoves().includes(i)) return msg("That tile is not next to the gap.");
    const z=S.slide.indexOf(0);
    S.slide[z]=S.slide[i]; S.slide[i]=0;
    drawSlide();
    if(S.slide.every((v,k)=>v===(k===8?0:k+1))) return void setTimeout(S.onDone,350);
    msg("");
  }

  /* ---------- mastermind (room 31) ---------- */
  const MMC={R:"#ff6b6b",Y:"#ffd93d",G:"#3ddc97",B:"#5ec8ff"};
  function mmScore(g){
    let black=0, white=0;
    g.forEach((c,i)=>{ if(c===S.secret[i]) black++; else if(S.secret.includes(c)) white++; });
    return {black,white};
  }
  function drawMM(){
    const h=$("mmhist"); if(!h) return;
    h.innerHTML = S.tries.map(t=>
      '<div class="mmrow">'+t.g.map(c=>'<i style="background:'+MMC[c]+'"></i>').join("")+
      '<span class="pegs2">'+"⚫".repeat(t.black)+"⚪".repeat(t.white)+
      (t.black+t.white?"":"·")+'</span></div>').join("");
    $("mmslots").innerHTML=[0,1,2].map(i=>
      '<span class="slot2"'+(S.guess[i]?' style="background:'+MMC[S.guess[i]]+'"':'')+'></span>').join("");
  }
  function mmTap(b){
    if(S.guess.length>=3) return msg("Three already — press Check, or Clear.");
    const c=b.dataset.mm;
    if(S.guess.includes(c)) return msg("No colour is used twice in the code.");
    S.guess.push(c); drawMM(); msg("");
  }
  function mmCheck(){
    if(S.guess.length<3) return msg("Pick three colours first.");
    const sc=mmScore(S.guess);
    S.tries.push({g:S.guess.slice(),...sc});
    S.guess=[]; drawMM();
    if(sc.black===3) return void setTimeout(S.onDone,350);
    msg("Guess "+S.tries.length+": "+sc.black+" ⚫ and "+sc.white+" ⚪");
  }

  /* ---------- minefield (room 32) ---------- */
  function mineCount(r,c){
    let n=0;
    for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
      if(!dr&&!dc) continue;
      if(S.mines.some(m=>m[0]===r+dr&&m[1]===c+dc)) n++;
    }
    return n;
  }
  function drawMines(){
    const g=$("minegrid"); if(!g) return;
    let h="";
    for(let r=0;r<4;r++) for(let c=0;c<4;c++){
      if(S.shown[r][c]) h+='<div class="fixed">'+mineCount(r,c)+'</div>';
      else{
        const f=S.flags.some(x=>x[0]===r&&x[1]===c);
        h+='<button data-mine="'+r+'-'+c+'">'+(f?"🚩":"")+'</button>';
      }
    }
    g.innerHTML=h;
  }
  function mineTap(b){
    const [r,c]=b.dataset.mine.split("-").map(Number);
    const i=S.flags.findIndex(x=>x[0]===r&&x[1]===c);
    if(i>=0) S.flags.splice(i,1);
    else{
      if(S.flags.length>=3) return msg("That is already three flags — take one back first.");
      S.flags.push([r,c]);
    }
    drawMines();
    if(S.flags.length===3 && S.flags.every(f=>S.mines.some(m=>m[0]===f[0]&&m[1]===f[1])))
      return void setTimeout(S.onDone,350);
    if(S.flags.length===3){ wrong(); return msg("Three flags, but not all of them are right."); }
    msg(S.flags.length+" of 3 flagged");
  }

  /* ---------- nonogram (room 33) ---------- */
  function nonoClues(line){
    const out=[]; let run=0;
    line.forEach(v=>{ if(v) run++; else { if(run) out.push(run); run=0; } });
    if(run) out.push(run);
    return out.length?out:[0];
  }
  function drawNono(){
    const box=$("nonobox"); if(!box) return;
    const rows=S.nsol.map(r=>nonoClues(r).join(" "));
    const cols=[0,1,2,3,4].map(c=>nonoClues(S.nsol.map(r=>r[c])).join(" "));
    let h='<div class="nono">';
    h+='<span class="nc"></span>'+cols.map(t=>'<span class="nc top">'+t+'</span>').join("");
    for(let r=0;r<5;r++){
      h+='<span class="nc side">'+rows[r]+'</span>';
      for(let c=0;c<5;c++)
        h+='<button class="ncell'+(S.ngrid[r][c]?" on":"")+'" data-nono="'+r+'-'+c+'"></button>';
    }
    box.innerHTML=h+'</div>';
  }
  function nonoTap(b){
    const [r,c]=b.dataset.nono.split("-").map(Number);
    S.ngrid[r][c]=S.ngrid[r][c]?0:1;
    drawNono();
    const done=S.nsol.every((row,r)=>row.every((v,c)=>v===S.ngrid[r][c]));
    if(done) setTimeout(S.onDone,350);
    else msg(S.ngrid.flat().filter(Boolean).length+" squares filled");
  }

  /* ---------- bridge at night (room 34) ---------- */
  function drawBridge(){
    const box=$("bridgebox"); if(!box) return;
    const near = S.torch==="L" ? S.bl : S.br;
    const FACE={1:"🧒",2:"👦",5:"👩",10:"👴"};
    box.innerHTML=
      '<div class="banks"><div class="bank"><b>this side</b><div class="stuff">'+
        (S.bl.map(t=>FACE[t]+t).join(" ")||"—")+'</div>'+
        (S.torch==="L"?'<div class="you">🔦</div>':'<div class="you dim">·</div>')+
      '</div><div class="water">〰️</div><div class="bank"><b>far side</b><div class="stuff">'+
        (S.br.map(t=>FACE[t]+t).join(" ")||"—")+'</div>'+
        (S.torch==="R"?'<div class="you">🔦</div>':'<div class="you dim">·</div>')+
      '</div></div>'+
      '<div class="row">'+near.map(t=>
        '<button class="big'+(S.sel.includes(t)?" picked":"")+'" data-brg="'+t+'">'+FACE[t]+'<br><small>'+t+'</small></button>'
      ).join("")+'</div>';
    $("btime").textContent=S.time+" min";
  }
  function brgTap(b){
    const t=+b.dataset.brg;
    const i=S.sel.indexOf(t);
    if(i>=0) S.sel.splice(i,1);
    else{
      if(S.sel.length>=2) return msg("Only two may cross at a time.");
      S.sel.push(t);
    }
    drawBridge(); msg("");
  }
  function brgGo(){
    if(!S.sel.length) return msg("Choose one or two travellers.");
    const from = S.torch==="L" ? S.bl : S.br;
    const to   = S.torch==="L" ? S.br : S.bl;
    S.sel.forEach(t=>{ from.splice(from.indexOf(t),1); to.push(t); });
    S.time += Math.max(...S.sel);
    S.sel=[]; S.torch = S.torch==="L" ? "R" : "L";
    S.bl.sort((a,b)=>a-b); S.br.sort((a,b)=>a-b);
    drawBridge();
    if(S.bl.length===0){
      if(S.time<=17) return void setTimeout(S.onDone,400);
      wrong(); msg("Everyone is across, but it took "+S.time+" minutes. The torch went out!");
      S.resetTimer=setTimeout(()=>{ S.bl=[1,2,5,10]; S.br=[]; S.torch="L"; S.time=0; S.sel=[]; drawBridge(); },1800);
      return;
    }
    if(S.time>17){
      wrong(); msg("Past 17 minutes — the torch is out. Starting again.");
      S.resetTimer=setTimeout(()=>{ S.bl=[1,2,5,10]; S.br=[]; S.torch="L"; S.time=0; S.sel=[]; drawBridge(); },1600);
      return;
    }
    msg(S.time+" minutes used");
  }

  /* ---------- two jugs (room 35) ---------- */
  function drawJugs(){
    const box=$("jugbox"); if(!box) return;
    const jug=(v,cap,label)=>{
      const h=150, fill=h*v/cap;
      return `<div class="jug"><svg viewBox="0 0 70 ${h}" width="66" height="${h}">
        <rect x="3" y="0" width="64" height="${h}" rx="10" fill="#e8f4fb"/>
        <rect x="3" y="${h-fill}" width="64" height="${fill}" rx="8" fill="#5ec8ff"/>
        ${[...Array(cap-1)].map((_,i)=>`<line x1="3" y1="${h-(i+1)*h/cap}" x2="67" y2="${h-(i+1)*h/cap}"
           stroke="#b9d8e8" stroke-width="2"/>`).join("")}
        <rect x="3" y="0" width="64" height="${h}" rx="10" fill="none" stroke="#7fa8bd" stroke-width="4"/>
      </svg><b>${v} / ${cap} L</b><span class="mini">${label}</span></div>`;
    };
    box.innerHTML='<div class="jugs">'+jug(S.jugA,5,"big jug")+jug(S.jugB,3,"small jug")+'</div>';
  }
  function jugTap(b){
    const a=b.dataset.jug;
    if(a==="fa") S.jugA=5;
    else if(a==="fb") S.jugB=3;
    else if(a==="ea") S.jugA=0;
    else if(a==="eb") S.jugB=0;
    else if(a==="ab"){ const p=Math.min(S.jugA,3-S.jugB); S.jugA-=p; S.jugB+=p; }
    else if(a==="ba"){ const p=Math.min(S.jugB,5-S.jugA); S.jugB-=p; S.jugA+=p; }
    drawJugs();
    if(S.jugA===4) return void setTimeout(S.onDone,400);
    msg("Big jug: "+S.jugA+" L · small jug: "+S.jugB+" L");
  }

  /* ---------- two guards (room 36) ---------- */
  function askTap(b){
    const q=+b.dataset.ask;
    // truth: the LEFT door is the exit. The guard you are asking is the liar — but it
    // makes no difference for question 1, which is the whole point.
    const ANS=[
      'The guard shrugs and says: <b>"Yes."</b> … but you have no idea whether to believe him.',
      'He answers: <b>"He would say — no."</b>',
      'He answers: <b>"Yes, of course."</b> … which is exactly what a liar would say too.'

    box.innerHTML='<p style="font-size:18px">'+ANS[q]+'</p>'+

      '<button class="big" data-door2="R">🚪<br><small>right</small></button></div>';
  }
  function door2Tap(b){
    if(S.asked===null) return msg("Ask a question first.");
    if(b.dataset.door2==="L") return void setTimeout(S.onDone,350);
    wrong(); msg("That door leads straight back into this room. Try the other one.");
  }

  /* ---------- sokoban (room 37) ---------- */
  function drawSok(){
    const g=$("sokgrid"); if(!g) return;
    let h="";
    for(let r=0;r<4;r++) for(let c=0;c<4;c++){
      const wall=S.sokW.some(w=>w[0]===r&&w[1]===c);
      const p=S.sokP[0]===r&&S.sokP[1]===c, crate=S.sokC[0]===r&&S.sokC[1]===c;
      const t=S.sokT[0]===r&&S.sokT[1]===c;
      h+='<div class="'+(wall?"wall":t?"target":"")+'">'+(p?"🧒":crate?"📦":t?"❌":"")+'</div>';
    }
    g.innerHTML=h;
  }
  function sokTap(b){
    const d=b.dataset.sok;
    const dr=d==="u"?-1:d==="d"?1:0, dc=d==="l"?-1:d==="r"?1:0;
    const nr=S.sokP[0]+dr, nc=S.sokP[1]+dc;
    const wall=(r,c)=> r<0||r>3||c<0||c>3||S.sokW.some(w=>w[0]===r&&w[1]===c);
    if(wall(nr,nc)) return msg("A wall.");
    if(S.sokC[0]===nr && S.sokC[1]===nc){            // pushing the crate
      const cr=nr+dr, cc=nc+dc;
      if(wall(cr,cc)) return msg("The crate will not go that way.");
      S.sokC=[cr,cc];
    }
    S.sokP=[nr,nc]; drawSok();
    if(S.sokC[0]===S.sokT[0] && S.sokC[1]===S.sokT[1]) return void setTimeout(S.onDone,350);
    msg("");
  }

  /* ---------- one line (room 38) ---------- */
  function drawPath(){
    const g=$("pathgrid"); if(!g) return;
    let h="";
    for(let r=0;r<4;r++) for(let c=0;c<4;c++){
      const at=S.path.findIndex(p=>p[0]===r&&p[1]===c);
      const head=at===S.path.length-1;
      const cls=[at>=0?"on":"", head?"head":"", (r===0&&c===0)?"start":"", (r===0&&c===3)?"endcell":""]
        .filter(Boolean).join(" ");
      h+='<button class="'+cls+'" data-path="'+r+'-'+c+'">'+(at>=0?at+1:"")+'</button>';
    }
    g.innerHTML=h;
  }
  function pathTap(b){
    const [r,c]=b.dataset.path.split("-").map(Number);
    const head=S.path[S.path.length-1];
    if(head[0]===r && head[1]===c){
      if(S.path.length===1) return msg("You are standing on the start.");
      S.path.pop(); drawPath(); return msg(S.path.length+" of 16 tiles.");
    }
    if(S.path.some(p=>p[0]===r&&p[1]===c)) return msg("You have already been there.");
    if(Math.abs(head[0]-r)+Math.abs(head[1]-c)!==1) return msg("Only one step at a time — no diagonals.");
    S.path.push([r,c]); drawPath();
    if(S.path.length===16){
      if(r===0&&c===3) return void setTimeout(S.onDone,350);
      wrong(); return msg("All sixteen — but you must finish on the red tile.");
    }
    msg(S.path.length+" of 16 tiles.");
  }

  /* ---------- fake coin (room 39) ---------- */
  function drawCoins(){
    const box=$("coinbox"); if(!box) return;
    const where=v=>v===1?"left pan":v===2?"right pan":"";
    box.innerHTML='<div class="coins">'+S.pan.map((v,i)=>
      '<button class="coin p'+v+'" data-coin="'+i+'">🪙<small>'+(i+1)+'</small></button>').join("")+'</div>'+
      '<p class="mini">left pan: '+(S.pan.filter(v=>v===1).length)+' · right pan: '+
      (S.pan.filter(v=>v===2).length)+' · weighings used: '+S.weighs+' of 2</p>'+
      (S.accusing?'<p class="mini">Now tap the coin you believe is fake.</p>':'');
  }
  function coinTap(b){
    const i=+b.dataset.coin;
    if(S.accusing){
      if(i===S.fake) return void setTimeout(S.onDone,350);
      wrong(); S.accusing=false;
      msg("That one is genuine. Put the coins back and think again.");
      S.pan=[0,0,0,0,0,0,0,0]; S.weighs=0; drawCoins();
      return;
    }
    S.pan[i]=(S.pan[i]+1)%3; drawCoins(); msg("");
  }
  function weighTap(){
    if(S.accusing) return msg("You are naming the fake — tap a coin.");
    if(S.weighs>=2) return msg("No weighings left. Name the fake coin.");
    const L=S.pan.filter(v=>v===1).length, R=S.pan.filter(v=>v===2).length;
    if(!L||!R) return msg("Put coins on both pans first.");
    const w=side=>S.pan.reduce((a,v,i)=>a+(v===side?(i===S.fake?0.9:1):0),0);
    const l=w(1), r=w(2);
    S.weighs++;
    const res = l<r ? "The LEFT pan rises — it is lighter."
              : r<l ? "The RIGHT pan rises — it is lighter."
              : "They balance exactly.";
    drawCoins();
    msg(res+"  ("+S.weighs+" of 2 used)");
  }

  /* ---------- the grand lock (room 40) ---------- */
  function grandStage(){
    const dots=n=>[0,1,2].map(i=>i<n?"🔓":"🔒").join(" ");
    if(S.stage===0){
      S.showGot=true;
      order(["G","O","L","D"], ()=>{ S.stage=1; grandStage(); });
      open(`<h2>Lock 1 — the word</h2><p class="mini">${dots(0)}</p>
        <p>Every letter has slipped <b>two</b> steps forward:</p>
        <div class="clue">I Q N F</div>
        <div class="row">${["D","F","G","I","L","N","O","Q"].map(c=>
          '<button class="big" data-ord="'+c+'">'+c+'</button>').join("")}</div>
        <p class="msg">Step each letter back two.</p>
        <div class="row"><button class="btn alt" data-close>Later</button></div>`);
    } else if(S.stage===1){
      S.code=7; S.codeLen=1;
      S.onDone=()=>{ S.stage=2; grandStage(); };
      open(`<h2>Lock 2 — the number</h2><p class="mini">${dots(1)}</p>
        <p>"Double me, then add six, and you have twenty. What am I?"</p>
        <div class="screen" id="scr">_</div>${keypad(false)}
        <div class="row"><button class="btn alt" data-close>Later</button></div>`);
    } else {
      S.onDone=S.grandDone;
      open(`<h2>Lock 3 — the pattern</h2><p class="mini">${dots(2)}</p>
        <div class="clue">1 · 4 · 9 · 16 · 25 · ?</div>
        <div class="row">
          <button class="big" data-pick="no">30</button>
          <button class="big" data-pick="ok">36</button>
          <button class="big" data-pick="no">35</button>
        </div>
        <p class="msg">1×1, 2×2, 3×3 …</p>
        <div class="row"><button class="btn alt" data-close>Later</button></div>`);
    }
  }

  /* ---------- zebra logic grid (room 41) ---------- */
  const ZCOL=["·","🟥","🟦","🟩"], ZPET=["·","🐈","🐕","🐦"];
  function drawZebra(){
    const box=$("zebrabox"); if(!box) return;
    box.innerHTML='<div class="zebra">'+
      '<span class="zl">house</span>'+[1,2,3].map(n=>'<span class="zh">'+n+'</span>').join("")+
      '<span class="zl">colour</span>'+S.zc.map((v,i)=>'<button data-zc="'+i+'">'+ZCOL[v]+'</button>').join("")+
      '<span class="zl">pet</span>'+S.zp.map((v,i)=>'<button data-zp="'+i+'">'+ZPET[v]+'</button>').join("")+
      '</div>';
  }
  function zebraCheck(){
    // solution: house1 green+dog, house2 red+cat, house3 blue+bird
    return S.zc.join("")==="312" && S.zp.join("")==="213";
  }
  function zebraTap(b){
    if(b.dataset.zc!==undefined){ const i=+b.dataset.zc; S.zc[i]=(S.zc[i]+1)%4; }
    else { const i=+b.dataset.zp; S.zp[i]=(S.zp[i]+1)%4; }
    drawZebra();
    if(zebraCheck()) return void setTimeout(S.onDone,350);
    msg("");
